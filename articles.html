<style>
  .ar-groups{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 16px}
  .ar-chip{appearance:none;cursor:pointer;font-family:var(--sans);font-size:.82rem;font-weight:600;color:var(--text-dim);background:var(--surface);border:1px solid var(--border);border-radius:999px;padding:6px 13px;transition:.15s}
  .ar-chip:hover{border-color:var(--accent);color:var(--accent)}
  .art{scroll-margin-top:80px}
  .ar-done{appearance:none;cursor:pointer;display:inline-flex;align-items:center;gap:6px;margin-top:14px;font-family:var(--sans);font-size:.86rem;font-weight:600;color:#fff;background:var(--accent);border:1px solid var(--accent);border-radius:999px;padding:8px 16px}
  .ar-done[aria-pressed="true"]{color:var(--ok);background:transparent;border-color:var(--ok)}
  [data-theme="dark"] .ar-done[aria-pressed="false"]{color:#0B0E14}
  .ar-done small{font-weight:500;opacity:.8}
</style>

<body>
<div class="grain"></div>
<script>window.LAB_SECTION='articles';</script>
<script src="appbar.js"></script>

<div class="wrap">

  <div class="reading-view" id="view-reading">
    <div class="rd-controls">
      <span class="count" id="count"></span>
      <button class="btn" id="rdToggle" aria-pressed="false" style="margin-left:auto">Türkçeyi gizle</button>
    </div>
    <div class="ar-groups" id="arGroups" role="group" aria-label="Grubun makalelerine git"></div>
    <div id="rdList"></div>
  </div>

</div>

<script src="data.js"></script>
<script src="lab-core.js"></script>
<script>
/* ============ OKUMA (hikâyeler) ============ */
const readingView=document.getElementById('view-reading');
const rdList=document.getElementById('rdList'), rdToggle=document.getElementById('rdToggle');
const countEl=document.getElementById('count');
const MARK_RE=/\{\{([^}|]+)(?:\|([^}]+))?\}\}/g;

/* Grup düğmeleri yalnızca kaydırır, listeyi süzmez. Makalenin grubu
   elle yazılmaz: işaretli kelimelerinin çoğu hangi gruptansa odur
   (data.js). Düğme, o grubun listedeki ilk makalesine iner. */
function mainGroup(a){
  const c={};
  a.en.replace(MARK_RE,(m,x,y)=>{
    const e=LOOKUP[(y||x).trim().toLowerCase()];
    if(e && typeof e.grp==='number') c[e.grp]=(c[e.grp]||0)+1;
    return m;
  });
  let best=null;
  Object.keys(c).map(Number).sort((p,q)=>p-q).forEach(g=>{ if(best==null || c[g]>c[best]) best=g; });
  return best;
}
const FIRST_OF={};   // grup -> ilk makalesinin sırası
ARTICLES.forEach((a,i)=>{ const g=mainGroup(a); if(g!=null && !(g in FIRST_OF)) FIRST_OF[g]=i; });

function renderArticleEN(text){
  return text.trim().split(/\n\s*\n/).map(p=>
    '<p>'+p.trim().replace(MARK_RE,(m,a,b)=>{
      const base=(b||a).trim().toLowerCase();
      return '<b class="artword wordref" data-w="'+base+'">'+a.trim()+'</b>';
    })+'</p>'
  ).join('');
}
function renderArticleTR(text){
  return text.trim().split(/\n\s*\n/).map(p=>'<p>'+p.trim()+'</p>').join('');
}
/* Çalıştım düğmesi: makalenin İngilizce kelime sayısı kadar puan (NSDay,
   ar). Aynı makale günde bir kez sayılır; tekrar basmak bugünkü işareti
   geri alır. */
const WORDS_OF = ARTICLES.map(a => NSDay.countWords(a.en.replace(MARK_RE,(m,x)=>x)));
function doneToday(){ return NSDay.day(NSDay.today()).ar; }
function doneBtn(i){
  const on = !!doneToday()[ARTICLES[i].title], n = WORDS_OF[i], pts = NSDay.r1(n*NSDay.POINTS.ar);
  return '<button type="button" class="ar-done" data-done="'+i+'" aria-pressed="'+on+'">'+
    (on ? '✓ Bugün çalışıldı <small>+'+pts+' puan · geri al</small>' : 'Çalıştım <small>· '+n+' kelime · +'+pts+' puan</small>')+'</button>';
}
function renderReading(){
  rdList.innerHTML = ARTICLES.map((a,i)=>
    '<article class="art" id="art-'+i+'">'+
      '<h3 class="art-title">'+a.title+'</h3>'+
      '<div class="art-en">'+renderArticleEN(a.en)+'</div>'+
      '<div class="art-tr">'+renderArticleTR(a.tr)+'</div>'+
      doneBtn(i)+
    '</article>'
  ).join('');
  if(countEl) countEl.textContent = ARTICLES.length+' hikâye';
  document.getElementById('arGroups').innerHTML = Object.keys(FIRST_OF).map(Number).sort((p,q)=>p-q)
    .map(g=>'<button type="button" class="ar-chip" data-g="'+g+'">Grup '+g+' ↓</button>').join('');
}
function goGroup(g, smooth){
  const el=document.getElementById('art-'+FIRST_OF[g]);
  if(el) el.scrollIntoView({behavior:smooth?'smooth':'auto', block:'start'});
}
document.getElementById('arGroups').addEventListener('click', e=>{
  const b=e.target.closest('[data-g]'); if(b) goGroup(+b.dataset.g, true);
});
rdList.addEventListener('click', e=>{
  const b=e.target.closest('[data-done]'); if(!b) return;
  const i=+b.dataset.done, on=b.getAttribute('aria-pressed')!=='true';
  NSDay.articleDone(ARTICLES[i].title, WORDS_OF[i], on);
  b.outerHTML=doneBtn(i);
  if(on && window.successFX){ try{ window.successFX(); }catch(err){} }
});
/* başka sekmede/cihazda işaretlenirse düğmeler güncellensin */
window.addEventListener('ns-state-changed', ()=>{
  document.querySelectorAll('[data-done]').forEach(b=>{ b.outerHTML=doneBtn(+b.dataset.done); });
});
rdToggle.addEventListener('click', ()=>{
  const hidden=readingView.classList.toggle('hide-tr');
  rdToggle.setAttribute('aria-pressed', hidden?'true':'false');
  rdToggle.textContent = hidden ? 'Türkçeyi göster' : 'Türkçeyi gizle';
});
renderReading();
/* ?g=7 (Shades'teki bağlantı): açılışta o grubun makalesine in */
try{ const q=+new URLSearchParams(location.search).get('g'); if(q in FIRST_OF) setTimeout(()=>goGroup(q,false),0); }catch(e){}
</script>
</body>
