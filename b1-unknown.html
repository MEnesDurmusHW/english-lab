<style>
  .tab-n{font-style:normal;font-family:var(--mono);font-size:.7rem;font-weight:700;opacity:.6;margin-left:4px}
  .b1l-search{flex:1 1 160px;min-width:0;max-width:260px;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:8px 12px;font-family:var(--sans);font-size:.88rem;color:var(--text)}

  #modeSeg[hidden]{display:none}

<script src="b1-data.js"></script>
<script src="b1-core.js"></script>
<script>
/* ============================================================
   B1 Listeleri — kartlardaki filtreye dokunmadan üç liste:
     Bilinemeyenler  en az bir kez denenmiş, "Known" olmamış (gizliler hariç)
                     — yeni Vocabulary grubu için aday havuzu, kopyalanır
     Bilinenler      "Known" seviyesindekiler (gizliler hariç) — Gizle düğmesi
     Gizliler        rotasyondan çıkarılanlar — Geri getir düğmesi
   "Untried" kelimeler hiçbir listede yok: henüz sınanmadılar.
   Sekme ?tab=unknown|known|hidden ile açılabilir.
   ============================================================ */
'use strict';

const $ = id => document.getElementById(id);
const listEl = $('list'), countEl = $('count'), copyBtn = $('copyBtn');
const TABS = ['unknown', 'known', 'hidden'];
let tab = 'unknown', mode = 'broad', query = '';   // mode: 'broad' = Weak + Shaky · 'weak' = yalnızca Weak

const HINT = {
  unknown: 'En az bir kez denenmiş ama henüz “Known” seviyesine ulaşmamış kelimeler. Yeni bir Vocabulary grubu için aday havuzu. Hiç denenmemişler ve gizlediklerin burada yok.',
  known: 'B1 kartlarında “Known” seviyesine gelmiş kelimeler. Zaten oturmuş olanları buradan tek tıkla gizleyebilirsin.',
  hidden: 'Rotasyondan çıkardığın kelimeler. Kartlarda ve diğer listelerde görünmezler. Geri getirdiğin kelime kartlara döner.'
};
const EMPTY = {
  unknown: () => mode === 'weak' ? '“Weak” durumunda kelime yok.' : 'Denenmiş ama “Known” seviyesine gelmemiş kelime kalmadı.',
  known: () => 'Henüz “Known” seviyesine gelen kelime yok.',
  hidden: () => 'Gizlenen kelime yok. Kartlarda Gizle düğmesiyle (ya da G tuşuyla) ekleyebilirsin.'
};
const EYE_OFF = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/><path d="M14.12 14.12a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>';
const RESTORE = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9 9 0 0 0-6.36 2.64L3 8"/><path d="M3 3v5h5"/></svg>';

function unknownWords(){
  return B1.filter(w => {
    if (b1IsHidden(w.en)) return false;
    const st = b1StatusOf(w.en);
    return mode === 'weak' ? st === 'weak' : (st === 'weak' || st === 'shaky');
  });
}
function knownWords(){ return B1.filter(w => !b1IsHidden(w.en) && b1StatusOf(w.en) === 'known'); }
function hiddenWords(){ return B1.filter(w => b1IsHidden(w.en)); }
const SOURCE = { unknown: unknownWords, known: knownWords, hidden: hiddenWords };

function matchesQuery(w){
  if (!query) return true;
  const q = query.toLowerCase();
  return w.en.toLowerCase().indexOf(q) >= 0 || String(w.tr || '').toLowerCase().indexOf(q) >= 0;
}
function current(){ return SOURCE[tab]().filter(matchesQuery); }

function wordRow(w){
  const st = b1StatusOf(w.en);
  let act = '';
  if (tab === 'known') act = '<button type="button" class="row-btn" data-a="hide" title="Gizle" aria-label="Gizle">' + EYE_OFF + '</button>';
  if (tab === 'hidden') act = '<button type="button" class="row-btn" data-a="restore" title="Geri getir" aria-label="Geri getir">' + RESTORE + '</button>';
  return '<div class="entry" data-en="' + w.en.replace(/"/g, '&quot;') + '"><div class="entry-row">' +
    '<div class="entry-head" style="cursor:default">' +
      '<span class="eh-main"><span class="eh-term">' + w.en + '</span><span class="eh-tr">' + w.tr + '</span></span>' +
      '<span class="eh-meter" data-st="' + st + '" title="' + B1_STATUS_LABEL[st] + ' · ' + b1AccText(w.en) + '"><i></i><i></i><i></i></span>' +
      '<span class="eh-type">' + (B1_POS_LABEL[w.pos] || w.pos) + '</span>' +
    '</div>' +
    (act ? '<span class="entry-actions">' + act + '</span>' : '') +
  '</div></div>';
}

function render(){
  $('nUnknown').textContent = unknownWords().length;
  $('nKnown').textContent = knownWords().length;
  $('nHidden').textContent = hiddenWords().length;
  TABS.forEach(t => $('tab-' + t).setAttribute('aria-selected', t === tab ? 'true' : 'false'));
  $('hint').textContent = HINT[tab];
  $('modeSeg').hidden = tab !== 'unknown';
  const words = current();
  countEl.textContent = words.length + ' kelime';
  copyBtn.disabled = !words.length;
  listEl.innerHTML = words.length
    ? '<div class="list">' + words.map(wordRow).join('') + '</div>'
    : '<div class="empty">' + (query ? 'Aramaya uyan kelime yok.' : EMPTY[tab]()) + '</div>';
}

function setTab(t){
  tab = TABS.indexOf(t) >= 0 ? t : 'unknown';
  try { history.replaceState(null, '', '?tab=' + tab); } catch (e) {}
  render();
}
TABS.forEach(t => $('tab-' + t).addEventListener('click', () => setTab(t)));

function setMode(m){
  mode = m;
  $('modeBoth').setAttribute('aria-selected', m === 'broad' ? 'true' : 'false');
  $('modeWeak').setAttribute('aria-selected', m === 'weak' ? 'true' : 'false');
  render();
}
$('modeBoth').addEventListener('click', () => setMode('broad'));
$('modeWeak').addEventListener('click', () => setMode('weak'));
$('search').addEventListener('input', e => { query = e.target.value.trim(); render(); });

listEl.addEventListener('click', e => {
  const b = e.target.closest('[data-a]'); if (!b) return;
  const en = b.closest('.entry').dataset.en;
  if ((b.dataset.a === 'hide' && !b1IsHidden(en)) || (b.dataset.a === 'restore' && b1IsHidden(en))) b1ToggleHidden(en);
  render();
});

function fallbackCopy(text, cb){
  const ta = document.createElement('textarea'); ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
  document.body.appendChild(ta); ta.select();
  try { document.execCommand('copy'); cb(); } catch (e) {}
  document.body.removeChild(ta);
}
copyBtn.addEventListener('click', () => {
  const text = current().map(w => w.en).join('\n');
  if (!text) return;
  const label = copyBtn.querySelector('span');
  const done = () => {
    copyBtn.classList.add('done'); label.textContent = 'Kopyalandı';
    setTimeout(() => { copyBtn.classList.remove('done'); label.textContent = 'Tümünü kopyala'; }, 1600);
  };
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done).catch(() => fallbackCopy(text, done));
  else fallbackCopy(text, done);
});

let startTab = 'unknown';
try { const q = new URLSearchParams(location.search).get('tab'); if (q) startTab = q; } catch (e) {}
setTab(startTab);

/* Başka bir sekme ya da bulut değiştirdi: yeniden çiz. */
window.addEventListener('ns-state-changed', render);
</script>
