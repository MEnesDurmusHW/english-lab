<style>
  /* Review kartı başarı oranı */
  .acc-card{margin-top:22px;border:1px solid var(--border);border-left:4px solid var(--acc-c,var(--border));border-radius:var(--radius);padding:16px 18px;background:var(--surface);box-shadow:var(--shadow-sm)}
  .acc-card[data-st="ok"]{--acc-c:var(--ok)}
  .acc-card[data-st="near"],.acc-card[data-st="easy"]{--acc-c:var(--mid)}
  .acc-card[data-st="low"]{--acc-c:var(--bad)}
  .acc-h{font-family:var(--display);font-size:1rem;font-weight:700;color:var(--text);margin:0 0 12px}
  .acc-nums{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
  .acc-num{font-family:var(--display);font-weight:700;font-size:1.6rem;line-height:1;color:var(--text);letter-spacing:-.02em}
  .acc-cap{font-size:.8rem;color:var(--text-dim);margin-top:5px}
  .acc-status{font-size:.9rem;font-weight:600;color:var(--acc-c,var(--text));margin:14px 0 0}
  .acc-card[data-st="none"] .acc-status{color:var(--text-dim)}
  .acc-rule{font-size:.82rem;color:var(--text-dim);line-height:1.6;margin:4px 0 0}
  .acc-ask{margin-top:14px;padding:12px 14px;border-radius:12px;background:var(--surface-2);font-size:.82rem;line-height:1.6;color:var(--text-dim);overflow-wrap:anywhere}
  .acc-ask .btn{margin-top:10px;padding:8px 16px;font-size:.84rem}
</style>

<body>
<div class="grain"></div>

<div class="wrap">

  <div class="subbar">
    <div class="seg" role="tablist" aria-label="Progress">
      <button id="tab-overview" role="tab" aria-selected="true">Overview</button>
      <button id="tab-known" role="tab" aria-selected="false">Known</button>
    </div>
  </div>

  <div class="ctlbar" id="groupBar" hidden>
    <p class="ctlbar-hint">Grup filtresi tüm sekmeleri kapsar.</p>
    <div class="ctlbar-right">
      <div id="filterMount"></div>
    </div>
  </div>

  <div id="view-overview" role="tabpanel">
    <div class="stats-wrap" id="statsWrap"></div>
    <div class="stats-wrap" id="cardAcc"></div>
  </div>

  <div id="view-known" role="tabpanel" hidden>

  </div>

</div>

<script src="data.js"></script>
<script src="lab-core.js"></script>
<script>
/* ============ OVERVIEW (istatistik) ============ */
const statsWrap=document.getElementById('statsWrap');
function renderStats(){
  const pool=WORDS.filter(matchesGroup);
  const total=pool.length; let known=0, shaky=0, weak=0, studied=0;
  pool.forEach(w=>{ const st=statusOf(w.en); if(st==='known')known++; else if(st==='weak')weak++; else shaky++; if(w.en in SCORES) studied++; });
  const hid=pool.filter(w=>isHidden(w.en)).length;
  const pct=function(n){ return total ? Math.round(n/total*100) : 0; };
  const seg=function(cls,n){ return n ? '<i class="'+cls+'" style="width:'+(n/total*100)+'%"></i>' : ''; };
  const dot={known:'var(--ok)', shaky:'var(--mid)', weak:'var(--bad)'};
  const cell=function(k,label,n){ return '<div class="stat-cell"><div class="stat-num">'+n+'</div><div class="stat-cap"><span class="stat-dot" style="background:'+dot[k]+'"></span>'+label+' · %'+pct(n)+'</div></div>'; };
  statsWrap.innerHTML=
    '<p class="q-score">'+total+' kelime · '+studied+' çalışıldı · %'+pct(known)+' biliniyor'+(hid?' · '+hid+' öğrenildi':'')+'</p>'+
    '<div class="stat-bar">'+seg('s-known',known)+seg('s-shaky',shaky)+seg('s-weak',weak)+'</div>'+
    '<div class="stat-grid">'+cell('known','Biliyorum',known)+cell('shaky','Sağlam değil',shaky)+cell('weak','Zayıf',weak)+'</div>'+
    '<p class="stat-note">Kartlarda ve testlerde her doğru skoru +1, her yanlış -1 değiştirir. Skor '+KNOWN_AT+' ve üzeri: Biliyorum. Eksi: Zayıf.</p>'+
    '<div class="f-row" style="margin-top:18px"><button class="btn" id="statsReset">İlerlemeyi sıfırla</button></div>';
  const rb=document.getElementById('statsReset');
  if(rb) rb.addEventListener('click', ()=>{ if(confirm('Yalnızca skorlar (bilme durumu) sıfırlanacak. Yazdığın cümleler ve “öğrendim” işaretlediğin kelimeler korunur. Emin misin?')){ SCORES={}; saveScores(); renderStats(); } });
}

/* ============ Review kartı başarı oranı ============
   Hedef %85–90 doğru (journey-core.js CARD_IV). Oran %80'in altına
   düşer ya da %95'i geçerse, aralıkları ayarlatmak için hazır istek
   metni gösterilir. Günlük kayıttan (NSDay rc) okunur, gruptan bağımsız.
   Yalnızca şimdiki aralıklarla verilen cevaplar sayılır (CARD_IV_FROM). */
const accEl=document.getElementById('cardAcc');
const ACC_MIN=40;   // bundan az cevapla karar verilmez
const MONTHS=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function cardTally(days){
  let hit=0, miss=0;
  if(!window.NSDay) return {hit, miss, n:0, since:null};
  const t=NSDay.today(), first=NSDay.firstDay();
  const from=(window.NSJourney && NSJourney.CARD_IV_FROM) || '';
  const start=NSDay.addDays(t,-(days-1));
  for(let i=0;i<days;i++){
    const d=NSDay.addDays(t,-i);
    if((first && d<first) || d<from) break;
    const rc=NSDay.day(d).rc;
    hit+=rc[0]; miss+=rc[1];
  }
  return {hit, miss, n:hit+miss, since: from>start ? from : null};
}
function sinceText(d){ const p=d.split('-'); return 'Since '+MONTHS[+p[1]-1]+' '+(+p[2]); }
function ivText(){
  const iv=window.NSJourney && NSJourney.CARD_IV;
  if(!iv) return '';
  return ' Current CARD_IV (days): '+['high','med','low'].map(p=>NSJourney.PRI_LABEL[p]+' '+iv[p].join(', ')).join(' · ')+'.';
}
function renderCardAcc(){
  if(!accEl) return;
  const m=cardTally(30), w=cardTally(7);
  const pct=r=>r.n ? Math.round(r.hit/r.n*100) : 0;
  const p=pct(m);
  let st, label;
  if(m.n<ACC_MIN){ st='none'; label='Not enough answers yet ('+m.n+' of '+ACC_MIN+').'; }
  else if(p<80){ st='low'; label='Too hard: the gaps are too long.'; }
  else if(p>95){ st='easy'; label='Too easy: the gaps can be longer.'; }
  else if(p>=85 && p<=90){ st='ok'; label='On target.'; }
  else { st='near'; label='Close to target. No change needed.'; }
  const num=(r,cap)=>'<div><div class="acc-num">'+(r.n ? pct(r)+'%' : '–')+'</div><div class="acc-cap">'+(r.since ? sinceText(r.since) : cap)+' · '+(r.n ? r.hit+' / '+r.n+' correct' : 'no answers')+'</div></div>';
  let ask='';
  if(st==='low' || st==='easy'){
    ask='English Lab: Review card accuracy is '+p+'% '+(m.since ? 'since '+m.since : 'over the last 30 days')+' ('+m.hit+'/'+m.n+'). Target is 85–90%. Please '+
      (st==='low' ? 'shorten' : 'lengthen')+' the Review card intervals in journey-core.js (CARD_IV) by about 20%, set CARD_IV_FROM to the next day, and tell me the new values.'+ivText();
  }
  accEl.innerHTML='<div class="acc-card" data-st="'+st+'">'+
    '<h3 class="acc-h">Review card accuracy</h3>'+
    '<div class="acc-nums">'+num(m,'Last 30 days')+num(w,'Last 7 days')+'</div>'+
    '<p class="acc-status">'+label+'</p>'+
    '<p class="acc-rule">Target: 85–90% correct. Below 80% means the gaps are too long.</p>'+
    (ask ? '<div class="acc-ask"><div id="accMsg"></div><button class="btn" id="accCopy" type="button">Copy request for Claude</button></div>' : '')+
  '</div>';
  if(!ask) return;
  document.getElementById('accMsg').textContent=ask;
  const b=document.getElementById('accCopy');
  b.addEventListener('click', ()=>copyText(ask, ()=>{ b.textContent='Copied'; setTimeout(()=>{ b.textContent='Copy request for Claude'; }, 1600); }));
}
function copyText(text, cb){
  if(navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(cb, ()=>fallbackCopy(text, cb));
  else fallbackCopy(text, cb);
}
function fallbackCopy(text, cb){
  const ta=document.createElement('textarea');
  ta.value=text; ta.style.position='fixed'; ta.style.opacity='0';
  document.body.appendChild(ta); ta.select();
  try{ document.execCommand('copy'); cb(); }catch(e){}
  document.body.removeChild(ta);
}
renderCardAcc();

/* ============ list view (known) ============
   Cümle listesi ve Learned kelimeler artık kendi sayfalarında:
   sentences.html ve review.html. */
const knownEl=document.getElementById('knownList');

function wordRow(w, actionsHTML){
  return '<div class="entry" data-type="'+w.type+'" data-i="'+w._i+'"><div class="entry-row">'+
    '<div class="entry-head" style="cursor:default">'+
      '<span class="eh-main"><span class="eh-term">'+w.en+'</span><span class="eh-tr">'+w.tr+'</span></span>'+
      '<span class="eh-type">'+typeLabel(w.type)+'</span>'+
    '</div>'+
    (actionsHTML ? '<span class="entry-actions">'+actionsHTML+'</span>' : '')+
  '</div></div>';
}
function renderWordList(el, list, emptyMsg, actionFn){
  if(!list.length){ el.innerHTML='<div class="empty">'+emptyMsg+'</div>'; return; }
  el.innerHTML='<div class="list">'+list.map(function(w){ return wordRow(w, actionFn?actionFn(w):''); }).join('')+'</div>';
}

function renderKnown(){
  renderWordList(knownEl, WORDS.filter(function(w){ return matchesGroup(w) && statusOf(w.en)==='known' && !isHidden(w.en); }),
    'Henüz “Biliyorum” seviyesine gelen kelime yok. Kart ve testlerde doğru yaptıkça buraya eklenir.',
    null);
}
/* ============ sub-tab controller ============ */
const P_RENDER={overview:renderStats, known:renderKnown};
const P_TABS=['overview','known'];
let currentPTab='overview';

/* grup filtresi (yalnızca Gruplar bölümü) — her sekmeyi gruba göre süzer */
(function(){
  const bar=document.getElementById('groupBar'), mount=document.getElementById('filterMount');
  if(!bar || !mount) return;
  if(typeof WORD_GROUPS==='undefined' || WORD_GROUPS.length < 2){ bar.hidden=true; return; }
  bar.hidden=false;
  mountFilter(mount, function(){ (P_RENDER[currentPTab]||renderStats)(); }, ['groups'], function(){ return WORDS.filter(matchesGroup).length; });
})();

function selectTab(t){
  if(P_TABS.indexOf(t)<0) t='overview';
  currentPTab=t;
  P_TABS.forEach(function(x){
    const v=document.getElementById('view-'+x), b=document.getElementById('tab-'+x);
    if(v) v.hidden = x!==t;
    if(b) b.setAttribute('aria-selected', x===t?'true':'false');
  });
  (P_RENDER[t]||renderStats)();
  try{ localStorage.setItem('ns-progress-tab', t); }catch(e){}
}
P_TABS.forEach(function(t){ const b=document.getElementById('tab-'+t); if(b) b.addEventListener('click', function(){ selectTab(t); }); });

let startTab='overview';
try{ const s=localStorage.getItem('ns-progress-tab'); if(s && P_TABS.indexOf(s)>=0) startTab=s; }catch(e){}
/* honor ?tab= deep-link */
try{ const qt=new URLSearchParams(location.search).get('tab'); if(qt && P_TABS.indexOf(qt)>=0) startTab=qt; }catch(e){}
selectTab(startTab);

/* Başka bir sekme ya da bulut ilerlemeyi değiştirdi — sayfanın tamamı
   salt okunur istatistik, olduğu gibi yeniden çizilebilir. */
window.addEventListener('ns-state-changed', function(){
  (P_RENDER[currentPTab]||renderStats)();
  renderCardAcc();
});
</script>
