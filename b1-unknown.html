<script src="b1-data.js"></script>
<script src="b1-core.js"></script>
<script>
/* ============================================================
   Bilinemeyenler — B1 Recall'da en az bir kez denenmiş ama
   "Known" seviyesine ulaşmamış kelimeleri listeler + kopyalar.
   "Untried" kelimeler kasıtlı olarak hariç: bunlar "bilinemedi"
   değil, henüz sınanmadı.
   ============================================================ */
'use strict';

const $ = id => document.getElementById(id);
const listEl = $('list'), countEl = $('count'), copyBtn = $('copyBtn');
const modeBothBtn = $('modeBoth'), modeWeakBtn = $('modeWeak');
let mode = 'broad';   // 'broad' = Weak + Shaky · 'weak' = yalnızca Weak

function unknownWords(){
  return B1.filter(function(w){
    if (b1IsHidden(w.en)) return false;
    const st = b1StatusOf(w.en);
    /* 'fresh' burada hiç istenmiyor: denenmemiş kelime "bilinemedi" değil. */
    return mode==='weak' ? st==='weak' : (st==='weak' || st==='shaky');
  });
}
function wordRow(w){
  const st = b1StatusOf(w.en);
  return '<div class="entry" data-i="'+w._i+'"><div class="entry-row">'+
    '<div class="entry-head" style="cursor:default">'+
      '<span class="eh-main"><span class="eh-term">'+w.en+'</span><span class="eh-tr">'+w.tr+'</span></span>'+
      '<span class="eh-meter" data-st="'+st+'" title="'+B1_STATUS_LABEL[st]+' · '+b1AccText(w.en)+'"><i></i><i></i><i></i></span>'+
      '<span class="eh-type">'+(B1_POS_LABEL[w.pos] || w.pos)+'</span>'+
    '</div></div></div>';
}
function render(){
  const words = unknownWords();
  countEl.textContent = words.length + ' kelime';
  copyBtn.disabled = !words.length;
  listEl.innerHTML = words.length
    ? '<div class="list">' + words.map(wordRow).join('') + '</div>'
    : '<div class="empty">' + (mode==='weak'
        ? '“Weak” durumunda kelime yok — güzel haber.'
        : 'Bu kritere uyan kelime yok. Denenmiş ama “Known” seviyesine gelmemiş kelime kalmadı.') + '</div>';
}
function setMode(m){
  mode = m;
  modeBothBtn.setAttribute('aria-selected', m==='broad' ? 'true' : 'false');
  modeWeakBtn.setAttribute('aria-selected', m==='weak' ? 'true' : 'false');
  render();
}
modeBothBtn.addEventListener('click', function(){ setMode('broad'); });
modeWeakBtn.addEventListener('click', function(){ setMode('weak'); });

function fallbackCopy(text, cb){
  const ta=document.createElement('textarea'); ta.value=text; ta.style.position='fixed'; ta.style.opacity='0';
  document.body.appendChild(ta); ta.select();
  try{ document.execCommand('copy'); cb(); }catch(e){}
  document.body.removeChild(ta);
}
copyBtn.addEventListener('click', function(){
  const text = unknownWords().map(function(w){ return w.en; }).join('\n');
  if (!text) return;
  const label = copyBtn.querySelector('span');
  const done = function(){
    copyBtn.classList.add('done'); label.textContent = 'Kopyalandı';
    setTimeout(function(){ copyBtn.classList.remove('done'); label.textContent = 'Tümünü kopyala'; }, 1600);
  };
  if (navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(done).catch(function(){ fallbackCopy(text, done); });
  } else { fallbackCopy(text, done); }
});

render();

/* Başka bir sekme ya da bulut ilerlemeyi değiştirdi — liste salt okunur. */
window.addEventListener('ns-state-changed', render);
</script>
