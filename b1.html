<script src="b1-data.js"></script>

<script>
/* ============================================================
   B1 Recall — sayfa mantığı
   Veri: B1 (b1-data.js) · Ortak mantık: b1-core.js
   data.js / lab-core.js / ns-vocab-* ile hiçbir bağlantısı yok.
   ============================================================ */
'use strict';

const $ = id => document.getElementById(id);
const app = $('app'), card = $('card'), faces = $('faces'), empty = $('empty'),
      badge = $('badge'), idxEl = $('idx'), scopeEl = $('scope'), railEl = $('rail'),
      fPos = $('fPos'), fTerm = $('fTerm'), fNote = $('fNote'),
      bPos = $('bPos'), bAnswer = $('bAnswer'), bTr = $('bTr'), bNote = $('bNote'),
      flipHint = $('flipHint'), dirBtn = $('dirBtn'), revealBtn = $('revealBtn'),
      revealLabel = $('revealLabel'),
      strip = $('strip'), segKnown = $('segKnown'), segShaky = $('segShaky'), segWeak = $('segWeak'),
      backdrop = $('backdrop'), progressSheet = $('progressSheet'), moreSheet = $('moreSheet'),
      moreBtn = $('moreBtn'), moreDirLabel = $('moreDirLabel');

let order = [], pos = 0, flipped = false, dirTR = true, lastSig = null, seen = 0;
let sessCards = 0, sessHits = 0;          // yalnızca bellekte — seans sayacı

const all = s => Array.prototype.slice.call(document.querySelectorAll(s));

/* ---- tur (torba): filtre değişmedikçe tur bitmeden kelime tekrar etmez ---- */
function buildOrder(keepCurrent){
  const cur = (keepCurrent && order.length) ? order[pos] : null;
  order = b1Shuffle(b1Active().map(w => w._i));
  lastSig = b1FilterSig();
  pos = 0;
  if (cur != null){ const at = order.indexOf(cur); if (at >= 0) pos = at; }
}
function cur(){ return B1[order[pos]]; }

/* ---- kart ---- */
function renderCard(){
  const has = order.length > 0;
  card.hidden = !has; empty.hidden = has;
  all('.b1-icon-btn, .b1-nav-btn, .b1-util-btn').forEach(b => { if(!b.id) b.disabled = !has; });
  revealBtn.disabled = !has;
  all('.js-hit, .js-miss').forEach(b => { b.disabled = !has; });

  if (!has){
    idxEl.textContent = '0 / 0';
    setRevealed(false);
    renderProgress();
    return;
  }
  const w = cur();
  flipped = false;
  card.classList.remove('is-flipped');
  setRevealed(false);
  idxEl.textContent = (pos + 1) + ' / ' + order.length;

  const posLabel = B1_POS_LABEL[w.pos] || w.pos;
  fPos.textContent = posLabel;
  bPos.textContent = posLabel;

  if (dirTR){
    fTerm.textContent = w.tr;
    bAnswer.textContent = w.en;
    bTr.textContent = w.tr;
    /* ayrım notu ön yüzde ipucu — başlık kelimesi maskeli */
    fNote.innerHTML = w.note ? b1MaskHead(w.note, w.en) : '';
    bNote.textContent = w.note || '';          // arka yüzde maskesiz tam metin
  } else {
    fTerm.textContent = w.en;
    bAnswer.textContent = w.tr;
    bTr.textContent = w.en;
    fNote.innerHTML = '';                      // EN görünürken not Türkçeyi ele verebilir
    bNote.textContent = w.note || '';
  }
  fTerm.classList.toggle('is-long', fTerm.textContent.length > 24);
  bAnswer.classList.toggle('is-long', bAnswer.textContent.length > 24);
  card.setAttribute('aria-label', 'Kartı çevir');

  renderBadge();
  syncToggleBtns();
  renderProgress();
}
function renderBadge(){
  if (!order.length){ badge.className = 'b1-badge'; badge.textContent = ''; return; }
  const en = cur().en, t = b1Tries(en);
  if (!t){ badge.className = 'b1-badge st-new'; badge.textContent = 'Yeni'; return; }
  const st = b1StatusOf(en);
  badge.className = 'b1-badge st-' + st;
  badge.textContent = B1_STATUS_LABEL[st] + ' · ' + b1AccText(en) + ' (' + b1Hits(en) + '/' + t + ')';
}
/* Puanlama düğmeleri her zaman etkin — kart çevrilmeden de işaretlenebilir.
   "Cevabı göster" bir geçiş düğmesi; dock yüksekliği sabit kalır, düzen zıplamaz. */
function setRevealed(on){
  app.classList.toggle('is-revealed', on);
  revealLabel.textContent = on ? 'Cevabı gizle' : 'Cevabı göster';
}

/* ---- ilerleme: şerit + ray + alt sayfa ---- */
function stats(){
  const scope = b1Active();
  let known = 0, shaky = 0, weak = 0, fresh = 0, hits = 0, tries = 0;
  scope.forEach(w => {
    const t = b1Tries(w.en);
    tries += t; hits += b1Hits(w.en);
    if (!t){ fresh++; return; }
    const s = b1StatusOf(w.en);
    if (s === 'known') known++; else if (s === 'weak') weak++; else shaky++;
  });
  return { n: scope.length, known, shaky, weak, fresh, hits, tries,
           learned: B1.filter(w => b1IsHidden(w.en)).length };
}
function renderProgress(){
  const s = stats(), n = s.n || 1;
  app.classList.toggle('is-zero', s.tries === 0);
  segKnown.style.width = (s.known / n * 100).toFixed(2) + '%';
  segShaky.style.width = (s.shaky / n * 100).toFixed(2) + '%';
  segWeak.style.width  = (s.weak  / n * 100).toFixed(2) + '%';
  strip.setAttribute('aria-label',
    'İlerleme: ' + s.known + ' biliyorum, ' + s.shaky + ' sağlam değil, ' + s.weak + ' zayıf, ' + s.fresh + ' denenmedi');

  /* sıfır durumunda boş bir çizgi yerine o an bilinen gerçek sayıyı göster */
  const acc = s.tries ? Math.round(s.hits / s.tries * 100) + '%' : String(s.n);
  /* sıfır durumu 5 satırlık hâlin alt kümesi — iskelet değişmez, zıplama olmaz */
  const rows = s.tries === 0
    ? '<div class="b1-rail-row"><i class="b1-dot-none"></i><span>Denenmedi</span><b>' + s.fresh + '</b></div>' +
      '<div class="b1-rail-row"><i class="b1-dot-learned"></i><span>Öğrendim</span><b>' + s.learned + '</b></div>'
    : '<div class="b1-rail-row"><i class="b1-dot-known"></i><span>Biliyorum</span><b>' + s.known + '</b></div>' +
      '<div class="b1-rail-row"><i class="b1-dot-shaky"></i><span>Sağlam değil</span><b>' + s.shaky + '</b></div>' +
      '<div class="b1-rail-row"><i class="b1-dot-weak"></i><span>Zayıf</span><b>' + s.weak + '</b></div>' +
      '<div class="b1-rail-row"><i class="b1-dot-none"></i><span>Denenmedi</span><b>' + s.fresh + '</b></div>' +
      '<div class="b1-rail-row"><i class="b1-dot-learned"></i><span>Öğrendim</span><b>' + s.learned + '</b></div>';

  const html =
    '<div class="b1-acc' + (s.tries ? '' : ' is-none') + '">' + acc + '</div>' +
    '<p class="b1-acc-label">' + (s.tries ? 'doğru olma skoru' : 'kelime · henüz deneme yok') + '</p>' +
    '<hr class="b1-rail-sep">' + rows +
    '<hr class="b1-rail-sep">' +
    '<p class="b1-session-label">Bu seans</p>' +
    '<p class="b1-session-val">' + sessCards + ' kart · ' + sessHits + ' doğru</p>';

  railEl.innerHTML = html;
  if (!progressSheet.hidden) progressSheet.innerHTML = '<h3>İlerleme</h3>' + html;

  scopeEl.textContent = scopeLabel(s.n);
}
function scopeLabel(n){
  const parts = [];
  if (b1SelPacks.length){
    const ids = b1SelPacks.slice().sort((a, b) => a - b);
    parts.push(ids.length === 1 ? 'Paket ' + ids[0]
      : 'Paket ' + ids[0] + '–' + ids[ids.length - 1] + (ids.length !== ids[ids.length - 1] - ids[0] + 1 ? ' (seçili)' : ''));
  } else parts.push('Tüm paketler');
  if (b1SelPos.length) parts.push(b1SelPos.map(p => B1_POS_LABEL[p] || p).join(', '));
  if (b1SelStatus.length) parts.push(b1SelStatus.map(s => B1_STATUS_LABEL[s]).join(', '));
  if (b1SelSaved.indexOf('flagged') >= 0) parts.push('İşaretli');
  if (b1SelSaved.indexOf('learned') >= 0) parts.push('Öğrendiklerim');
  parts.push(n + ' kelime');
  return parts.join(' · ');
}

/* ---- eylemler ---- */
function flip(){
  if (!order.length) return;
  flipped = !flipped;
  card.classList.toggle('is-flipped', flipped);
  setRevealed(flipped);
  card.setAttribute('aria-label', flipped ? 'Kartı çevir (cevap görünüyor)' : 'Kartı çevir');
  if (flipped){
    seen++;
    if (seen > 3) app.classList.add('is-seasoned');
  }
}
function slide(dir){
  const cls = dir > 0 ? 'enter-right' : 'enter-left';
  faces.classList.remove('enter-right', 'enter-left');
  void faces.offsetWidth;
  faces.classList.add(cls);
}
function next(){ if (!order.length) return; pos = (pos + 1) % order.length; renderCard(); slide(1); }
function prev(){ if (!order.length) return; pos = (pos - 1 + order.length) % order.length; renderCard(); slide(-1); }
function shuffleAll(){ if (!order.length) return; buildOrder(false); renderCard(); slide(1); }
function rate(hit, btn){
  if (!order.length) return;
  b1AddResult(cur().en, hit);
  sessCards++; if (hit) sessHits++;
  if (btn){ btn.classList.add('is-pulse'); setTimeout(() => btn.classList.remove('is-pulse'), 130); }
  if (hit && typeof window.successFX === 'function'){ try { window.successFX(); } catch (e) {} }
  next();
}
function resetCurrent(){ if (!order.length) return; b1ResetWord(cur().en); renderCard(); closeSheets(); }
function toggleFlag(){ if (!order.length) return; b1ToggleFlag(cur().en); syncToggleBtns(); renderProgress(); }
function toggleLearned(){
  if (!order.length) return;
  const w = cur();
  b1ToggleHidden(w.en);
  if (!b1Matches(w)){
    order.splice(pos, 1);
    if (pos >= order.length) pos = 0;
  }
  renderCard(); closeSheets();
}
function syncToggleBtns(){
  const has = order.length > 0;
  const fl = has && b1IsFlagged(cur().en), le = has && b1IsHidden(cur().en);
  all('.js-flag').forEach(b => { b.classList.toggle('is-flagged', !!fl); b.setAttribute('aria-pressed', fl ? 'true' : 'false'); });
  all('.js-learn').forEach(b => { b.classList.toggle('is-learned', !!le); b.setAttribute('aria-pressed', le ? 'true' : 'false'); });
  all('.js-reset').forEach(b => { b.disabled = !has || b1Tries(cur().en) === 0; });
}
function setDir(tr){
  dirTR = tr;
  dirBtn.textContent = tr ? 'TR→EN' : 'EN→TR';
  dirBtn.setAttribute('aria-label', tr
    ? 'Yön: Türkçeden İngilizceye. Değiştirmek için dokun.'
    : 'Yön: İngilizceden Türkçeye. Değiştirmek için dokun.');
  moreDirLabel.textContent = tr ? 'Yön: EN→TR yap' : 'Yön: TR→EN yap';
  renderCard();
}

/* ---- alt sayfalar ---- */
function openSheet(el){
  closeSheets();
  if (el === progressSheet) progressSheet.innerHTML = '<h3>İlerleme</h3>' + railEl.innerHTML;
  el.hidden = false; backdrop.hidden = false;
  if (el === progressSheet) strip.setAttribute('aria-expanded', 'true');
  if (el === moreSheet) moreBtn.setAttribute('aria-expanded', 'true');
}
function closeSheets(){
  progressSheet.hidden = true; moreSheet.hidden = true; backdrop.hidden = true;
  strip.setAttribute('aria-expanded', 'false');
  moreBtn.setAttribute('aria-expanded', 'false');
}

/* ---- filtre değişince turu yeniden kur ---- */
function onFilterChange(){
  if (b1FilterSig() !== lastSig) buildOrder(true);
  renderCard();
  fltUI.refresh();
}

/* ---- olaylar ---- */
card.addEventListener('click', flip);
card.addEventListener('keydown', e => { if (e.key === ' ' || e.key === 'Enter'){ e.preventDefault(); flip(); } });
revealBtn.addEventListener('click', flip);
all('.js-next').forEach(b => b.addEventListener('click', next));
all('.js-prev').forEach(b => b.addEventListener('click', prev));
all('.js-shuffle').forEach(b => b.addEventListener('click', () => { shuffleAll(); closeSheets(); }));
all('.js-reset').forEach(b => b.addEventListener('click', resetCurrent));
all('.js-flag').forEach(b => b.addEventListener('click', toggleFlag));
all('.js-learn').forEach(b => b.addEventListener('click', toggleLearned));
all('.js-hit').forEach(b => b.addEventListener('click', () => rate(true, b)));
all('.js-miss').forEach(b => b.addEventListener('click', () => rate(false, b)));
all('.js-dir').forEach(b => b.addEventListener('click', () => { setDir(!dirTR); closeSheets(); }));
dirBtn.addEventListener('click', () => setDir(!dirTR));
$('emptyClear').addEventListener('click', () => { b1ClearFilter(); onFilterChange(); });

strip.addEventListener('click', () => {
  /* Ray gerçekten görünüyorsa alt sayfaya gerek yok. Sabit bir kırılım
     noktası yerine öğenin görünürlüğüne bakıyoruz — ray artık 1120px'te
     devreye giriyor, iki yerde eşitlenmesi gereken sayı kalmasın. */
  if (railEl.offsetParent !== null) return;
  progressSheet.hidden ? openSheet(progressSheet) : closeSheets();
});
moreBtn.addEventListener('click', () => { moreSheet.hidden ? openSheet(moreSheet) : closeSheets(); });
backdrop.addEventListener('click', closeSheets);

/* kart üzerinde yatay kaydırma = gezinme */
let tx = 0, ty = 0, tt = 0;
card.addEventListener('touchstart', e => {
  const t = e.changedTouches[0]; tx = t.clientX; ty = t.clientY; tt = Date.now();
}, { passive: true });
card.addEventListener('touchend', e => {
  const t = e.changedTouches[0], dx = t.clientX - tx, dy = t.clientY - ty;
  if (Date.now() - tt < 400 && Math.abs(dx) > 56 && Math.abs(dx) > Math.abs(dy) * 1.5){
    e.preventDefault();
    dx < 0 ? next() : prev();
  }
});

document.addEventListener('keydown', e => {
  /* e.target document olabilir (odak yokken) — closest() her hedefte bulunmaz */
  const t = e.target;
  if (t && typeof t.closest === 'function' && t.closest('input, textarea')) return;
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key === 'Escape'){ closeSheets(); return; }
  const k = e.key.toLowerCase();
  if (e.key === ' '){ e.preventDefault(); flip(); }
  else if (e.key === 'ArrowRight'){ e.preventDefault(); next(); }
  else if (e.key === 'ArrowLeft'){ e.preventDefault(); prev(); }
  else if (k === 'm'){ e.preventDefault(); rate(true, document.querySelector('.js-hit')); }
  else if (k === 'n'){ e.preventDefault(); rate(false, document.querySelector('.js-miss')); }
  else if (k === 'l'){ e.preventDefault(); toggleFlag(); }
  else if (k === 'g'){ e.preventDefault(); toggleLearned(); }
  else if (k === 's'){ e.preventDefault(); shuffleAll(); }
});

/* ---- başlat ---- */
const fltUI = b1MountFilter($('filterMount'), onFilterChange);
buildOrder(false);
renderCard();
</script>
</body>
