<style>
  :root{ --mono:'Space Grotesk',monospace; --accent-soft:rgba(59,91,165,.16); --ok:#5c8a4a; --mid:#c68a2e; --bad:#c0552f; }
  [data-theme="dark"]{ --accent-soft:rgba(138,166,224,.2); --ok:#6fbf7f; --mid:#d8ac5c; --bad:#e0765a; }
  *{box-sizing:border-box}
  body{font-family:var(--sans);color:var(--text);background:var(--bg)}
  .wrap{max-width:900px;margin:0 auto;padding:74px 22px 120px}
  header.g-head{margin-bottom:8px}
  .eyebrow{font-family:var(--mono);font-size:.7rem;font-weight:600;letter-spacing:.22em;text-transform:uppercase;color:var(--text-muted);margin:0 0 8px}
  header.g-head h1{font-family:var(--serif);font-weight:600;font-size:clamp(2rem,5vw,2.9rem);letter-spacing:-.02em;margin:0;line-height:1.1}
  header.g-head p.sub{margin:14px 0 0;color:var(--text-dim);font-size:1.02rem;line-height:1.6;max-width:60ch}

  /* topic tabs */
  .topics{position:sticky;top:0;z-index:30;margin:26px -8px 6px;padding:12px 8px;background:linear-gradient(var(--bg) 72%,transparent)}
  .topics .seg{display:flex;gap:4px;background:var(--surface);border:1px solid var(--border);border-radius:999px;padding:4px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
  .topics .seg::-webkit-scrollbar{display:none}
  .topics .seg button{white-space:nowrap;appearance:none;border:0;background:transparent;cursor:pointer;color:var(--text-dim);font-family:var(--sans);font-weight:600;font-size:.9rem;padding:9px 18px;border-radius:999px;transition:.18s}
  .topics .seg button[aria-selected="true"]{background:var(--accent);color:#fff}
  .topics .seg button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

  .topic-head{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin:22px 0 20px}
  .topic-title{font-family:var(--serif);font-weight:600;font-size:1.5rem;margin:0;letter-spacing:-.01em;flex:1 1 240px;min-width:0}
  .practice-cta{appearance:none;flex:0 0 auto;display:inline-flex;align-items:center;gap:9px;cursor:pointer;background:var(--accent);border:1px solid var(--accent);color:#fff;font-family:var(--sans);font-weight:600;font-size:.92rem;padding:11px 22px;border-radius:999px;box-shadow:0 6px 20px rgba(0,0,0,.09);transition:transform .18s,box-shadow .18s}
  .practice-cta:hover{transform:translateY(-1px);box-shadow:0 10px 26px rgba(0,0,0,.14)}
  .practice-cta:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
  .practice-cta svg{width:15px;height:15px;flex:0 0 auto}
  .practice-cta .cta-n{font-family:var(--mono);font-size:.74rem;font-weight:700;opacity:.72}

  /* learn */
  .intro{font-size:1rem;color:var(--text-dim);line-height:1.7;text-align:justify;margin-bottom:8px}
  .intro p{margin:0 0 12px;text-align:justify}
  .intro b{color:var(--text);font-weight:600}
  .g-group{margin-top:26px}
  .g-group-label{font-family:var(--mono);font-size:.7rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);margin-bottom:12px}
  .g-item{border:1px solid var(--border);border-radius:12px;background:var(--surface);padding:13px 16px;margin-bottom:9px}
  .gi-term{font-size:1.02rem;color:var(--text);font-weight:600;line-height:1.4}
  .gi-key{color:var(--accent);font-weight:700;text-transform:uppercase;font-size:.82em;letter-spacing:.04em}
  .gi-ex{margin-top:5px;font-size:.95rem;color:var(--text-dim);line-height:1.55}
  .gi-ex b{color:var(--accent);font-weight:700}
  .gi-note{margin-top:6px;font-size:.86rem;color:var(--text-dim);line-height:1.5;font-style:italic;border-left:2px solid var(--accent-soft);padding-left:11px}
  .g-callout{border:1px solid var(--border);border-left:3px solid var(--accent);border-radius:10px;background:var(--surface);padding:14px 17px;margin:20px 0;font-size:.94rem;line-height:1.6;color:var(--text-dim)}
  .g-callout b{color:var(--text)}
  .right{color:var(--ok);font-weight:700}
  .wrong{color:var(--bad);font-weight:700;text-decoration:line-through}

  /* ===== practice: tam ekran katman ===== */
  .p-overlay{position:fixed;inset:0;z-index:1200;background:var(--bg);display:flex;flex-direction:column;overscroll-behavior:contain}
  .p-overlay[hidden]{display:none}
  body.p-open{overflow:hidden}
  .p-head{flex:0 0 auto;padding:calc(14px + env(safe-area-inset-top)) clamp(14px,4vw,26px) 0}
  .p-head-in{max-width:660px;margin:0 auto;display:flex;align-items:center;gap:14px}
  .p-topic{font-family:var(--mono);font-size:.68rem;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--text-muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .p-count{margin-left:auto;font-family:var(--mono);font-size:.74rem;font-weight:600;color:var(--text-muted);white-space:nowrap;font-variant-numeric:tabular-nums}
  .p-exit{appearance:none;flex:0 0 auto;width:34px;height:34px;display:grid;place-items:center;border:1px solid var(--border);border-radius:50%;background:var(--surface);color:var(--text-dim);cursor:pointer;transition:.15s}
  .p-exit:hover{border-color:var(--accent);color:var(--accent)}
  .p-exit svg{width:15px;height:15px}
  .p-track{max-width:660px;margin:13px auto 0;height:3px;border-radius:999px;background:var(--border);overflow:hidden}
  .p-fill{height:100%;width:0;border-radius:999px;background:var(--accent);transition:width .32s cubic-bezier(.4,0,.2,1)}
  .p-body{flex:1 1 auto;overflow-y:auto;display:flex;padding:26px clamp(14px,4vw,26px)}
  .p-foot{flex:0 0 auto;padding:0 clamp(14px,4vw,26px) calc(18px + env(safe-area-inset-bottom))}
  .p-foot-in{max-width:620px;margin:0 auto;display:flex;align-items:center;gap:10px}

  .p-wrap{width:100%;max-width:620px;margin:auto;text-align:center}
  .p-q{font-family:var(--serif);font-weight:500;font-size:clamp(1.18rem,3.6vw,1.46rem);line-height:1.6;color:var(--text);margin-bottom:26px}
  .p-q .blank{color:var(--accent);border-bottom:2px dashed var(--accent);padding:0 22px}
  .p-opts{display:grid;grid-template-columns:repeat(2,1fr);gap:11px;margin-bottom:16px}
  .p-opts.stack{grid-template-columns:1fr}
  .p-opt{position:relative;appearance:none;cursor:pointer;background:var(--surface);border:1px solid var(--border);border-radius:13px;padding:16px 16px 16px 38px;min-height:58px;display:flex;align-items:center;justify-content:center;font-family:var(--sans);font-size:1rem;font-weight:600;line-height:1.35;color:var(--text);transition:.14s}
  .p-opt:hover:not(:disabled){border-color:var(--accent)}
  .p-opt:disabled{cursor:default}
  .p-opt .k{position:absolute;left:13px;top:50%;transform:translateY(-50%);font-family:var(--mono);font-size:.68rem;font-weight:700;color:var(--text-muted);opacity:.8}
  .p-opt.correct{background:var(--ok);border-color:var(--ok);color:#fff}
  .p-opt.incorrect{background:var(--bad);border-color:var(--bad);color:#fff}
  .p-opt.correct .k,.p-opt.incorrect .k{color:#fff;opacity:.7}
  .p-explain{font-size:.92rem;color:var(--text-dim);line-height:1.6;margin:0 auto;max-width:52ch;min-height:3.2em}
  .p-explain b{color:var(--accent)}
  .p-btn{appearance:none;cursor:pointer;background:var(--surface);border:1px solid var(--border);border-radius:999px;padding:13px 26px;font-family:var(--sans);font-weight:600;font-size:.92rem;color:var(--text-dim);transition:.15s;white-space:nowrap}
  .p-btn:hover:not(:disabled){border-color:var(--accent);color:var(--accent)}
  .p-btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  .p-btn.primary:hover:not(:disabled){color:#fff}
  .p-btn:disabled{opacity:.35;cursor:default}
  .p-btn.grow{flex:1 1 auto}
  .p-kbd{margin-right:auto;font-family:var(--mono);font-size:.68rem;letter-spacing:.03em;color:var(--text-muted);display:none}
  .p-done{font-family:var(--serif);font-size:clamp(2.4rem,9vw,3.4rem);font-weight:600;line-height:1;color:var(--text);letter-spacing:-.02em}
  .p-pct{font-family:var(--mono);font-size:.82rem;font-weight:700;letter-spacing:.14em;color:var(--accent);margin:12px 0 16px}

  @media (hover:hover) and (min-width:640px){ .p-kbd{display:block} }
  @media (max-width:560px){ .p-opts{grid-template-columns:1fr} .wrap{padding-top:64px} .p-foot-in{flex-wrap:wrap} .p-btn{flex:1 1 auto;padding:13px 18px} }
</style>

<script>
/* ============ DATA ============ */
const GRAMMAR = [
{
  key:'prep', tab:'Prepositions', title:'Dependent Prepositions',
  intro:`<p>Many adjectives, verbs and nouns are followed by a fixed preposition. There is rarely a logical reason, so the safest way is to learn the word and its preposition together as one chunk: not just <b>afraid</b>, but <b>afraid of</b>.</p><p>The same base word can take different prepositions with different meanings (<b>good at</b> a skill, <b>good for</b> your health, <b>good with</b> people), so pay attention to the whole pattern.</p>`,
  groups:[
    {label:'Adjective + preposition', items:[
      {term:'afraid', key:'of', ex:'She is afraid <b>of</b> spiders.'},
      {term:'good / bad', key:'at', ex:"He's very good <b>at</b> chess.", note:'A skill or activity. Compare: good <b>for</b> your health, good <b>with</b> people.'},
      {term:'interested', key:'in', ex:'I am interested <b>in</b> history.'},
      {term:'keen', key:'on', ex:"They're keen <b>on</b> hiking."},
      {term:'proud', key:'of', ex:'We are proud <b>of</b> you.'},
      {term:'aware', key:'of', ex:'Are you aware <b>of</b> the risks?'},
      {term:'capable', key:'of', ex:"She's capable <b>of</b> much more."},
      {term:'fond', key:'of', ex:"He's fond <b>of</b> old films."},
      {term:'jealous', key:'of', ex:'He was jealous <b>of</b> his brother.'},
      {term:'responsible', key:'for', ex:'You are responsible <b>for</b> the budget.'},
      {term:'famous', key:'for', ex:'Italy is famous <b>for</b> its food.'},
      {term:'similar', key:'to', ex:'This is similar <b>to</b> the old model.'},
      {term:'different', key:'from', ex:'Mine is different <b>from</b> yours.', note:'"different than" (US) and "different to" (UK) are also heard, but "from" is the safe choice.'},
      {term:'married', key:'to', ex:"She's married <b>to</b> a doctor."},
      {term:'worried', key:'about', ex:"I'm worried <b>about</b> the exam."},
      {term:'excited', key:'about', ex:"We're excited <b>about</b> the trip."},
      {term:'angry', key:'with / about', ex:"She was angry <b>with</b> me <b>about</b> the delay.", note:'Angry <b>with</b> a person, angry <b>about</b> a thing.'},
      {term:'satisfied', key:'with', ex:'Are you satisfied <b>with</b> the result?'},
      {term:'full', key:'of', ex:'The box was full <b>of</b> books.'},
      {term:'tired', key:'of', ex:"I'm tired <b>of</b> waiting.", note:'"Tired of" = bored/fed up. "Tired from" = exhausted by effort.'},
      {term:'used', key:'to', ex:"I'm used <b>to</b> the noise now.", note:'"Be used to + noun / -ing" = accustomed. Different from "used to + verb" (past habit).'},
      {term:'allergic', key:'to', ex:"He's allergic <b>to</b> nuts."},
    ]},
    {label:'Verb + preposition', items:[
      {term:'depend / rely', key:'on', ex:'It depends <b>on</b> the weather.'},
      {term:'insist', key:'on', ex:'She insisted <b>on</b> paying.'},
      {term:'concentrate / focus', key:'on', ex:'Concentrate <b>on</b> your work.'},
      {term:'believe', key:'in', ex:'They believe <b>in</b> hard work.'},
      {term:'succeed', key:'in', ex:'He succeeded <b>in</b> passing.'},
      {term:'consist', key:'of', ex:'Water consists <b>of</b> hydrogen and oxygen.'},
      {term:'approve', key:'of', ex:"They didn't approve <b>of</b> the plan."},
      {term:'apologize', key:'for', ex:'She apologized <b>for</b> the mistake.', note:'apologize <b>to</b> someone <b>for</b> something.'},
      {term:'apply', key:'for', ex:'I applied <b>for</b> the job.'},
      {term:'wait / search / look', key:'for', ex:"We're waiting <b>for</b> the bus."},
      {term:'belong', key:'to', ex:'This book belongs <b>to</b> me.'},
      {term:'refer', key:'to', ex:'He referred <b>to</b> the report.'},
      {term:'listen', key:'to', ex:'Listen <b>to</b> me.'},
      {term:'object', key:'to', ex:'They objected <b>to</b> the noise.'},
      {term:'deal / cope', key:'with', ex:'How do you deal <b>with</b> stress?'},
      {term:'agree', key:'with', ex:'I agree <b>with</b> you.', note:'agree <b>with</b> a person, agree <b>on</b> a plan, agree <b>to</b> a request.'},
      {term:'suffer', key:'from', ex:'She suffers <b>from</b> migraines.'},
      {term:'benefit', key:'from', ex:'Everyone benefits <b>from</b> exercise.'},
      {term:'think', key:'about / of', ex:"I'm thinking <b>about</b> moving."},
    ]},
    {label:'Noun + preposition', items:[
      {term:'reason', key:'for', ex:"What's the reason <b>for</b> the delay?"},
      {term:'need / demand', key:'for', ex:'There is a need <b>for</b> change.'},
      {term:'solution / answer', key:'to', ex:'A solution <b>to</b> the problem.'},
      {term:'increase / rise / fall', key:'in', ex:'A sharp rise <b>in</b> prices.'},
      {term:'damage', key:'to', ex:'Damage <b>to</b> the engine.'},
      {term:'cause', key:'of', ex:'The cause <b>of</b> the fire.'},
      {term:'example', key:'of', ex:'A good example <b>of</b> teamwork.'},
      {term:'lack', key:'of', ex:'A lack <b>of</b> sleep.'},
      {term:'effect / influence', key:'on', ex:'The effect <b>on</b> children.'},
      {term:'attitude', key:'to / towards', ex:'Her attitude <b>towards</b> work.'},
      {term:'relationship', key:'with / between', ex:'A good relationship <b>with</b> clients.'},
    ]},
  ],
  quiz:[
    {q:"I'm not very good ___ maths.", a:'at', opts:['at','in','on','for']},
    {q:'It depends ___ the weather.', a:'on', opts:['on','of','from','to']},
    {q:'She apologized ___ being late.', a:'for', opts:['for','of','about','to']},
    {q:'This car is similar ___ mine.', a:'to', opts:['to','with','from','as']},
    {q:'They are afraid ___ the dark.', a:'of', opts:['of','from','with','to']},
    {q:'He suffers ___ terrible headaches.', a:'from', opts:['from','of','with','by']},
    {q:'I applied ___ a new job.', a:'for', opts:['for','to','on','at']},
    {q:'What is the reason ___ the change?', a:'for', opts:['for','of','to','behind']},
    {q:"We're worried ___ the results.", a:'about', opts:['about','for','with','of']},
    {q:'This book belongs ___ the library.', a:'to', opts:['to','with','for','of']},
    {q:'Please concentrate ___ your work.', a:'on', opts:['on','at','in','to']},
    {q:'Water consists ___ two elements.', a:'of', opts:['of','from','in','with']},
  ],
},
{
  key:'verb', tab:'Verb Patterns', title:'Verb Patterns: Gerund vs Infinitive',
  intro:`<p>When one verb follows another, the first verb decides the form of the second: the <b>-ing</b> form (gerund) or <b>to + verb</b> (infinitive). There is no rule you can hear, so the verbs are grouped by the pattern they force.</p><p>A small set of verbs take both forms with a real change in meaning, and those are worth learning carefully.</p>`,
  groups:[
    {label:'Verb + gerund (-ing)', items:[
      {term:'enjoy', key:'+ing', ex:'I enjoy <b>reading</b>.'},
      {term:'avoid', key:'+ing', ex:'He avoids <b>driving</b> at night.'},
      {term:'finish', key:'+ing', ex:'She finished <b>eating</b>.'},
      {term:'mind', key:'+ing', ex:"Do you mind <b>waiting</b>?"},
      {term:'suggest', key:'+ing', ex:'I suggest <b>leaving</b> early.'},
      {term:'consider', key:'+ing', ex:"We're considering <b>moving</b>."},
      {term:'imagine', key:'+ing', ex:'Imagine <b>living</b> there.'},
      {term:'admit / deny', key:'+ing', ex:'He admitted <b>stealing</b> it.'},
      {term:'miss', key:'+ing', ex:'I miss <b>seeing</b> them.'},
      {term:'practise', key:'+ing', ex:'Practise <b>speaking</b> daily.'},
      {term:'risk', key:'+ing', ex:"Don't risk <b>losing</b> it."},
      {term:'postpone / put off', key:'+ing', ex:'They postponed <b>meeting</b>.'},
      {term:"can't stand / can't help", key:'+ing', ex:"I can't stand <b>waiting</b>."},
      {term:'look forward to', key:'+ing', ex:'I look forward to <b>seeing</b> you.', note:'Here "to" is a preposition, so it takes -ing. Same with "be used to" and "object to".'},
    ]},
    {label:'Verb + infinitive (to + verb)', items:[
      {term:'want', key:'to', ex:'I want <b>to go</b>.'},
      {term:'decide', key:'to', ex:'They decided <b>to stay</b>.'},
      {term:'hope / plan', key:'to', ex:'We hope <b>to win</b>.'},
      {term:'promise / agree', key:'to', ex:'He promised <b>to help</b>.'},

      {term:'manage', key:'to', ex:'I managed <b>to finish</b>.'},
      {term:'afford', key:'to', ex:"We can't afford <b>to wait</b>."},
      {term:'learn', key:'to', ex:'She learned <b>to swim</b>.'},
      {term:'expect', key:'to', ex:'I expect <b>to arrive</b> late.'},
      {term:'seem / appear', key:'to', ex:'He seems <b>to know</b>.'},
      {term:'pretend', key:'to', ex:'She pretended <b>to sleep</b>.'},
      {term:'tend', key:'to', ex:'It tends <b>to rain</b> here.'},
    ]},
    {label:'Verb + object + infinitive', items:[
      {term:'want / ask / tell sb', key:'to', ex:'I want <b>you to stay</b>.'},
      {term:'advise / encourage sb', key:'to', ex:'She advised <b>me to rest</b>.'},
      {term:'allow / permit sb', key:'to', ex:'They allowed <b>him to leave</b>.'},
      {term:'remind / warn sb', key:'to', ex:'Remind <b>me to call</b>.'},
      {term:'persuade / force sb', key:'to', ex:'He persuaded <b>them to agree</b>.'},
    ]},
    {label:'Verb + bare infinitive (no "to")', items:[
      {term:'make sb', key:'do', ex:'It made <b>me laugh</b>.', note:'But in the passive: "I was made <b>to</b> laugh."'},
      {term:'let sb', key:'do', ex:'Let <b>me go</b>.'},
      {term:'had better / would rather', key:'do', ex:"You'd better <b>leave</b>. I'd rather <b>stay</b>."},
    ]},
    {label:'Both forms, different meaning', items:[
      {term:'stop', key:'to / -ing', ex:'He stopped <b>to smoke</b> vs. He stopped <b>smoking</b>.', note:'stop to do = pause in order to do it. stop doing = quit the activity.'},
      {term:'remember / forget', key:'to / -ing', ex:'I remembered <b>to lock</b> vs. I remember <b>locking</b>.', note:'remember to do = a task ahead. remember doing = a past memory.'},
      {term:'try', key:'to / -ing', ex:'Try <b>to open</b> it vs. Try <b>opening</b> it.', note:'try to do = attempt something hard. try doing = experiment to see if it helps.'},
      {term:'regret', key:'to / -ing', ex:'I regret <b>to inform</b> you vs. I regret <b>saying</b> that.', note:'regret to do = be sorry about bad news you are giving now. regret doing = be sorry about the past.'},
      {term:'go on', key:'to / -ing', ex:'She went on <b>to become</b> CEO vs. He went on <b>talking</b>.', note:'go on to do = move to a next stage. go on doing = continue the same thing.'},
    ]},
  ],
  quiz:[

    {q:"I'm looking forward to ___ you again.", a:'seeing', opts:['seeing','see','to see','saw'], note:'"to" here is a preposition, so -ing.'},

{
  key:'agree', tab:'Agreement', title:'Subject-Verb Agreement',
  intro:`<p>A verb must match its subject in number: a singular subject takes a singular verb, a plural subject takes a plural verb. The traps are almost always about spotting the <b>real</b> subject, especially when other words sit between it and the verb.</p>`,
  groups:[
    {label:'Core rules', items:[
      {term:'Words between subject and verb do not change agreement', ex:'The box of chocolates <b>is</b> on the table.', note:'The subject is "box" (singular), not "chocolates". Ignore the phrase in between.'},
      {term:'Two subjects joined by "and" are plural', ex:'Tom and Anna <b>are</b> here.', note:'Exception: a fixed single idea stays singular, e.g. "Fish and chips <b>is</b> my favourite."'},
      {term:'With "or / nor", the verb agrees with the nearer subject', ex:'Neither the manager nor the workers <b>were</b> happy.', note:'Reverse them and it changes: "Neither the workers nor the manager <b>was</b> happy."'},
      {term:'Each, every, either, neither + noun are singular', ex:'Every student <b>has</b> a book. Each of them <b>knows</b> the answer.'},
      {term:'Indefinite pronouns are singular', ex:'Everyone <b>is</b> ready. Somebody <b>has</b> left a bag.', note:'everyone, someone, anybody, nobody, each, one.'},
    ]},
    {label:'Quantifiers and "of" phrases', items:[
      {term:'"a number of" is plural, "the number of" is singular', ex:'A number of people <b>are</b> waiting. The number of visitors <b>has</b> risen.'},
      {term:'some / all / most / half of + noun agree with that noun', ex:'Most of the cake <b>is</b> gone. Most of the guests <b>have</b> arrived.'},
      {term:'One of + plural noun is singular', ex:'One of my friends <b>lives</b> abroad.', note:'The subject is "one", not "friends".'},
      {term:'Neither of / either of + plural noun is (formally) singular', ex:'Neither of the answers <b>is</b> correct.'},
    ]},
    {label:'Tricky nouns', items:[
      {term:'Uncountable nouns are singular', ex:'The news <b>is</b> good. This information <b>is</b> useful.', note:'news, information, advice, furniture, luggage, progress.'},
      {term:'Subjects ending in -ics are usually singular', ex:'Mathematics <b>is</b> hard. Economics <b>was</b> my major.'},
      {term:'Collective nouns: singular as a unit, plural as members', ex:'The team <b>is</b> strong. The team <b>are</b> arguing among themselves.', note:'British English allows the plural more freely than American English.'},
      {term:'"There is / are" agrees with what follows', ex:'There <b>is</b> a problem. There <b>are</b> two problems.'},
    ]},
  ],
  quiz:[
    {q:'The list of items ___ on your desk.', a:'is', opts:['is','are'], note:'Subject = "list" (singular). Ignore "of items".'},
    {q:'Each of the players ___ a number.', a:'has', opts:['has','have'], note:'"Each of" is singular.'},
    {q:'A number of students ___ absent today.', a:'are', opts:['is','are'], note:'"a number of" = many, plural.'},
    {q:'Neither the CEO nor the managers ___ available.', a:'are', opts:['is','are'], note:'The verb agrees with the nearer subject, "managers".'},
    {q:'Economics ___ a difficult subject.', a:'is', opts:['is','are'], note:'-ics subjects are singular.'},
    {q:'Everyone ___ done the homework.', a:'has', opts:['has','have'], note:'"Everyone" is singular.'},
    {q:'The news about the floods ___ worrying.', a:'is', opts:['is','are'], note:'"News" is uncountable, singular.'},
    {q:'One of my keys ___ missing.', a:'is', opts:['is','are'], note:'Subject = "one".'},
    {q:'Most of the water ___ gone.', a:'is', opts:['is','are'], note:'"Most of + uncountable" is singular.'},
    {q:'There ___ several reasons for this.', a:'are', opts:['is','are'], note:'Agrees with "reasons" (plural).'},
    {q:'Mathematics ___ my favourite subject.', a:'is', opts:['is','are']},
    {q:'Tom and his brother ___ coming tonight.', a:'are', opts:['is','are'], note:'Two subjects with "and" = plural.'},
  ],
},
{
  key:'tense', tab:'Tense', title:'Tense Consistency',
  intro:`<p>Within a single passage, keep your verbs in the same time frame. Shift tense only when the time itself genuinely changes. Random jumps between past and present are the most common writing error and they make a text feel careless.</p>`,
  groups:[
    {label:'Core rules', items:[
      {term:'Stay in one main tense', ex:'She <b>opened</b> the door and <b>walked</b> in.', note:'Not: She opened the door and <span class="wrong">walks</span> in.'},
      {term:'Use the past perfect for an earlier past event', ex:'By the time we <b>arrived</b>, the train <b>had left</b>.', note:'"had left" happened before "arrived". The order of events is shown by the tense, not by the word order.'},
      {term:'Backshift in reported speech', ex:'He said he <b>was</b> tired.', note:'Direct: "I am tired." present becomes past when reported after a past verb.'},
      {term:'Keep conditional patterns consistent', ex:'If I <b>had</b> more time, I <b>would</b> travel.', note:'Do not mix: "If I had more time, I <span class="wrong">will</span> travel."'},
      {term:'Present tense for general truths, even inside past narration', ex:'The teacher explained that water <b>boils</b> at 100C.', note:'A permanent fact can stay in the present.'},
    ]},
    {label:'Common shifts to fix', items:[
      {term:'Narrative drift', ex:'We <b>were</b> hiking when suddenly it <b>started</b> to rain.', note:'Both past. A shift to "starts" would be wrong.'},
      {term:'Time clauses match the main clause', ex:'When she <b>calls</b>, I <b>will tell</b> her.', note:'Future time is shown by "will" in the main clause; the time clause stays present.'},
      {term:'Do not jump to the present for drama by accident', ex:'Yesterday I <b>met</b> an old friend and we <b>talked</b> for hours.', note:'"talk" would break the past frame.'},
    ]},
  ],
  quiz:[
    {q:'She finished her coffee and ___ the house.', a:'left', opts:['left','leaves','will leave','leave'], note:'Stay in the past to match "finished".'},
    {q:'By the time we got there, the show ___.', a:'had started', opts:['had started','started','starts','has started'], note:'An earlier past event needs the past perfect.'},
    {q:'If I were rich, I ___ a boat.', a:'would buy', opts:['would buy','will buy','buy','bought'], note:'Second conditional: "were" + "would".'},
    {q:'He told me he ___ busy that week.', a:'was', opts:['was','is','will be','has been'], note:'Backshift after "told".'},
    {q:'We were watching TV when the phone ___.', a:'rang', opts:['rang','rings','will ring','ring'], note:'Both actions in the past.'},
    {q:'When the bus ___, we will get on.', a:'arrives', opts:['arrives','will arrive','arrived','arrive'], note:'Time clause stays present for a future meaning.'},
    {q:'The guide explained that the river ___ through three countries.', a:'flows', opts:['flows','flowed','will flow','flow'], note:'A general truth can stay present.'},
    {q:'Last summer we visited Rome and ___ amazing food.', a:'ate', opts:['ate','eat','eats','will eat'], note:'Keep the past frame.'},
    {q:'I had already eaten when she ___.', a:'arrived', opts:['arrived','arrives','had arrived','arrive'], note:'The later event is simple past; the earlier one was past perfect.'},
    {q:'She said she ___ finish it the next day.', a:'would', opts:['would','will','would have','had'], note:'"will" backshifts to "would".'},
  ],
},
{
  key:'adverb', tab:'Adverb Order', title:'Adverbial Order',
  intro:`<p>When several adverbials land at the end of a clause, English prefers a set order: <b>Manner, Place, Time</b> (how, where, when). Frequency adverbs behave differently and usually sit in mid-position, next to the verb.</p><p>One firm rule underlies all of this: never put an adverb between a verb and its direct object.</p>`,
  groups:[
    {label:'End-position order: Manner, Place, Time', items:[
      {term:'Manner before Place before Time', ex:'She sang <b>beautifully</b> (manner) <b>at the hall</b> (place) <b>last night</b> (time).'},
      {term:'Place before Time when only two appear', ex:'We met <b>in the park</b> <b>yesterday</b>.', note:'Not: "yesterday in the park" in neutral style.'},
      {term:'Direction/movement verbs: place can lead', ex:'They walked <b>home</b> <b>slowly</b>.', note:'With verbs of movement, the destination often comes right after the verb.'},
      {term:'Time can move to the front for emphasis', ex:'<b>Last night</b>, she sang beautifully at the hall.', note:'Fronting the time expression is fine and common.'},
    ]},
    {label:'Frequency and mid-position', items:[
      {term:'Frequency adverbs go before the main verb', ex:'I <b>always</b> drink coffee.', note:'always, usually, often, sometimes, rarely, never.'},
      {term:'But after the verb "be"', ex:'She <b>is often</b> late.'},
      {term:'And between the auxiliary and the main verb', ex:'They have <b>never</b> been abroad.'},
    ]},
    {label:'Firm rules', items:[
      {term:'Never split a verb and its object', ex:'She speaks English <b>fluently</b>.', note:'Not: She speaks <span class="wrong">fluently</span> English.'},
      {term:'Comment/viewpoint adverbs go to the front', ex:'<b>Honestly</b>, I disagree. <b>Fortunately</b>, no one was hurt.'},
      {term:'Time expressions: smaller unit before larger', ex:'The meeting is <b>at 3 pm on Monday</b>.', note:'Not: "on Monday at 3 pm" in neutral style.'},
    ]},
  ],
  quiz:[
    {q:'She sang ___.', a:'beautifully at the party last night', opts:['beautifully at the party last night','at the party beautifully last night','last night beautifully at the party','at the party last night beautifully'], note:'Manner, Place, Time.'},
    {q:'I ___ coffee in the morning.', a:'always drink', opts:['always drink','drink always'], note:'Frequency adverb before the main verb.'},
    {q:'He speaks ___.', a:'French fluently', opts:['French fluently','fluently French'], note:'Never put the adverb between the verb and its object.'},
    {q:'They ___ to Japan.', a:'have never been', opts:['have never been','have been never'], note:'Frequency adverb sits between the auxiliary and the main verb.'},
    {q:'We walked ___.', a:'home slowly', opts:['home slowly','slowly home'], note:'With movement verbs, the destination often comes first.'},
    {q:'She ___ late for meetings.', a:'is usually', opts:['is usually','usually is'], note:'Frequency adverb after the verb "be".'},
    {q:'The train leaves ___.', a:'at 6 pm on Friday', opts:['at 6 pm on Friday','on Friday at 6 pm'], note:'Smaller time unit before the larger one.'},
    {q:'Which order is natural?', a:'Fortunately, no one was injured', opts:['Fortunately, no one was injured','No one was injured, fortunately, at all'], note:'Comment adverbs sit most naturally at the front.'},
    {q:'I met her ___.', a:'in Paris last summer', opts:['in Paris last summer','last summer in Paris'], note:'Place before Time.'},
    {q:'He drove ___.', a:'carefully through the town this morning', opts:['carefully through the town this morning','through the town carefully this morning','this morning carefully through the town','through the town this morning carefully'], note:'Manner, Place, Time.'},
  ],
},
{
  key:'article', tab:'Articles', title:'Articles: a / an / the / zero',
  intro:`<p>Before a noun you have four options: <b>a</b>, <b>an</b>, <b>the</b>, or nothing at all (the "zero article"). Two questions settle almost every case. First: is the noun singular and countable? If so, it cannot stand alone. Second: can the listener already tell <b>which one</b> you mean? If yes, use <b>the</b>; if not, use <b>a/an</b>.</p><p>Plural and uncountable nouns take no article when you speak generally (<i>Dogs bark. Water is cheap.</i>) and take <b>the</b> when you mean particular ones (<i>the dogs next door</i>).</p>`,
  groups:[
    {label:'The basic choice', items:[
      {term:'a / an', key:'new, one of many', ex:'I saw <b>a</b> dog in the garden.', note:'Singular countable nouns only, and only when the listener cannot yet identify which one.'},
      {term:'the', key:'both know which', ex:'I saw a dog. <b>The</b> dog was limping.', note:'By the second mention it is identified, so it takes "the".'},
      {term:'zero article', key:'general', ex:'<b>Dogs</b> bark. <b>Water</b> is cheap.', note:'Plural or uncountable nouns in a general sense take nothing at all.'},
      {term:'"a" or "an" follows the sound, not the spelling', key:'sound', ex:'<b>a</b> university, <b>a</b> European, <b>an</b> hour, <b>an</b> MP', note:'"University" begins with a /j/ sound; "hour" begins with a vowel sound; "MP" is read "em-pee".'},
    ]},
    {label:'When "the" is required', items:[
      {term:'Second and later mentions', ex:'She bought a car. <b>The</b> car was red.'},
      {term:'Only one of its kind', ex:'<b>The</b> sun, <b>the</b> moon, <b>the</b> sky, <b>the</b> internet, <b>the</b> government.'},
      {term:'Superlatives, ordinals and "same"', ex:'<b>The</b> best day. <b>The</b> first attempt. <b>The</b> same problem.'},
      {term:'When a phrase after the noun identifies it', ex:'<b>The</b> man in the blue coat. <b>The</b> capital of France.', note:'Compare "a man" (any man) with "the man in the blue coat" (that specific one).'},
      {term:'Shared situation', ex:'Could you close <b>the</b> door?', note:'There is only one door in the room, so both speakers know which one.'},
      {term:'Musical instruments', ex:'She plays <b>the</b> violin.', note:'But sports and games take nothing: she plays tennis, he plays chess.'},
      {term:'Rivers, seas, ranges and plural place names', ex:'<b>The</b> Nile, <b>the</b> Atlantic, <b>the</b> Alps, <b>the</b> Netherlands, <b>the</b> USA.'},
      {term:'Adjectives standing for a whole group', ex:'<b>The</b> rich, <b>the</b> young, <b>the</b> unemployed.'},
    ]},
    {label:'When to use no article at all', items:[
      {term:'General plurals and uncountables', ex:'<b>Children</b> learn quickly. <b>Honesty</b> matters.', note:'Add "the" only for particular ones: "The children next door are loud."'},
      {term:'Most countries, cities, continents, single mountains and lakes', ex:'She lives in <b>Turkey</b>, near <b>Ankara</b>. They climbed <b>Everest</b>.'},
      {term:'Meals, languages, sports and academic subjects', ex:'We had <b>lunch</b>. He speaks <b>Arabic</b>. She studies <b>physics</b> and plays <b>tennis</b>.'},
      {term:'Institutions used for their purpose', ex:'He goes to <b>school</b>. She is in <b>hospital</b>. They went to <b>bed</b>.', note:'bed, school, university, church, prison, hospital, work, home.'},
      {term:'Fixed prepositional phrases', ex:'<b>by</b> car, <b>on</b> foot, <b>at</b> night, <b>in</b> town, <b>at</b> home.'},
    ]},
    {label:'Pairs that trap learners', items:[
      {term:'go to school vs go to the school', ex:'He goes to <b>school</b> (as a pupil) vs. I drove to <b>the school</b> to collect him (the building).'},
      {term:'in hospital vs in the hospital', ex:'She is in <b>hospital</b> (a patient) vs. I work in <b>the hospital</b> (that building).', note:'This split is British. American English says "in the hospital" for both.'},
      {term:'last week vs the last week', ex:'I saw him <b>last week</b> (the one before this) vs. <b>the last week</b> of term (the final one).'},
      {term:'a few / few, a little / little', ex:'I have <b>a few</b> friends (some — positive) vs. I have <b>few</b> friends (almost none — negative).'},
      {term:'Jobs need an article in the singular', ex:'She is <b>an</b> engineer.', note:'Not "She is engineer." The plural is fine without one: "They are engineers."'},
    ]},
  ],
  quiz:[
    {q:'She is ___ engineer at a car firm.', a:'an', opts:['an','a','the','—'], note:'Singular job title, and "engineer" starts with a vowel sound.'},
    {q:'___ sun rises in the east.', a:'The', opts:['The','A','An','—'], note:'There is only one sun.'},
    {q:'I never drink ___ coffee in the evening.', a:'—', opts:['—','a','an','the'], note:'Uncountable noun used generally.'},
    {q:'We waited for ___ hour.', a:'an', opts:['an','a','the','—'], note:'"Hour" begins with a vowel sound even though it starts with h.'},
    {q:'They spent last spring in ___ Netherlands.', a:'the', opts:['the','a','an','—'], note:'Plural country names take "the".'},
    {q:'My son goes to ___ school by bus.', a:'—', opts:['—','the','a','an'], note:'The institution used for its purpose takes no article.'},
    {q:'Could you turn off ___ light, please?', a:'the', opts:['the','a','an','—'], note:'Both of you know which light.'},
    {q:'She plays ___ piano beautifully.', a:'the', opts:['the','a','an','—'], note:'Musical instruments take "the".'},
    {q:'He is studying ___ economics in Vienna.', a:'—', opts:['—','the','a','an'], note:'Academic subjects take no article.'},
    {q:'That was ___ best film I have seen this year.', a:'the', opts:['the','a','an','—'], note:'Superlatives always take "the".'},
    {q:'Her father is ___ university lecturer.', a:'a', opts:['a','an','the','—'], note:'"University" begins with a /j/ sound, so "a".'},
    {q:'I know ___ children in that photograph.', a:'the', opts:['the','a','an','—'], note:'Specific children, identified by the phrase that follows.'},
  ],
},
{
  key:'phrasal', tab:'Phrasal Verbs', title:'Phrasal Verb Word Order',
  intro:`<p>A phrasal verb is a verb plus one or two particles (<b>turn off</b>, <b>look after</b>, <b>put up with</b>). The meaning is idiomatic, but the real difficulty is word order: where does the object go?</p><p>There are four types, and only one of them lets you move the object. The single rule you must never break: with a <b>separable</b> phrasal verb, a pronoun object always sits <b>between</b> the verb and the particle — <i>turn it off</i>, never <i>turn off it</i>.</p>`,
  groups:[
    {label:'Separable: a noun goes either side, a pronoun must go in the middle', items:[
      {term:'turn off', key:'separable', ex:'Turn off <b>the light</b>. / Turn <b>the light</b> off. / Turn <b>it</b> off.', note:'All three are fine except "turn off it", which is impossible.'},
      {term:'pick up / put down', key:'separable', ex:'She picked <b>the baby</b> up. She picked <b>her</b> up.'},
      {term:'take off / put on', key:'separable', ex:'Take your shoes off. Take <b>them</b> off.'},
      {term:'throw away / give back', key:'separable', ex:"Don't throw <b>it</b> away. I gave <b>it</b> back."},
      {term:'fill in / hand in', key:'separable', ex:'Fill the form in. Fill <b>it</b> in.'},
      {term:'look up (a word)', key:'separable', ex:'I looked the word up. I looked <b>it</b> up.'},
      {term:'call off / turn down / bring up', key:'separable', ex:'They called the match off. They called <b>it</b> off.'},
      {term:'A long object goes after the particle', ex:'She turned down <b>the very generous offer they had made</b>.', note:'Splitting the verb across a long phrase makes the sentence hard to follow, so keep the pair together.'},
    ]},
    {label:'Inseparable: the object always follows the particle', items:[
      {term:'look after', key:'inseparable', ex:'She looks after <b>the children</b>. She looks after <b>them</b>.', note:'Never "looks them after".'},
      {term:'look for', key:'inseparable', ex:"I'm looking for <b>my keys</b>."},
      {term:'get over', key:'inseparable', ex:'He got over <b>the illness</b> quickly.'},
      {term:'run into / come across', key:'inseparable', ex:'I ran into <b>an old friend</b>.'},
      {term:'take after', key:'inseparable', ex:'She takes after <b>her mother</b>.'},
      {term:'deal with / look into', key:'inseparable', ex:'Who will deal with <b>this</b>?'},
      {term:'count on / stand for', key:'inseparable', ex:'You can count on <b>me</b>.'},
      {term:'get on (a bus) / get off', key:'inseparable', ex:'We got on <b>the train</b> at Leeds.'},
    ]},
    {label:'Intransitive: no object at all', items:[
      {term:'break down', ex:'The car <b>broke down</b>.', note:'You cannot say "break something down" with this meaning.'},
      {term:'show up / turn up', ex:'He <b>showed up</b> two hours late.'},
      {term:'get up / grow up', ex:'She <b>grew up</b> in Izmir.'},
      {term:'take off (a plane)', ex:'The flight <b>took off</b> on time.'},
      {term:'give in / set off / come back', ex:'They finally <b>gave in</b>.'},
    ]},
    {label:'Three-word phrasal verbs: never split them', items:[
      {term:'put up with', ex:"I can't put up with <b>the noise</b>.", note:'The object always comes after all three words, even a pronoun: "put up with it".'},
      {term:'look forward to', ex:'I look forward to <b>your reply</b>.'},
      {term:'get on with / catch up with', ex:'She gets on with <b>everyone</b>.'},
      {term:'run out of', ex:'We ran out of <b>time</b>.'},
      {term:'come up with', ex:'He came up with <b>a solution</b>.'},
      {term:'look down on / get away with', ex:'They looked down on <b>him</b>.'},
    ]},
    {label:'How to tell which type you have', items:[
      {term:'The pronoun test', ex:'Say the verb with "it". If "verb + it + particle" sounds right, it is separable.', note:'"Turn it off" works, so "turn off" is separable. "Look it after" does not work, so "look after" is inseparable.'},
      {term:'Three particles means no splitting', ex:'put up with, get away with, look forward to.', note:'If there are two particles, the object goes at the end. Always.'},
      {term:'Adverbs never go inside the pair', ex:'She turned the offer down <b>flatly</b>.', note:'Not: "turned the offer flatly down".'},
    ]},
  ],
  quiz:[
    {q:'These shoes are muddy. Please ___.', a:'take them off', opts:['take them off','take off them'], note:'A pronoun object must sit inside a separable phrasal verb.'},
    {q:'I did not know the word, so I ___ in a dictionary.', a:'looked it up', opts:['looked it up','looked up it'], note:'"Look up" is separable, so the pronoun goes in the middle.'},
    {q:'My neighbour ___ while we are away.', a:'looks after our cat', opts:['looks after our cat','looks our cat after'], note:'"Look after" is inseparable: nothing goes between the two words.'},
    {q:'I cannot ___ the noise from the street.', a:'put up with', opts:['put up with','put with up','up put with'], note:'Three-word phrasal verbs are never split.'},
    {q:'The match was cancelled — they ___ an hour before kick-off.', a:'called it off', opts:['called it off','called off it'], note:'Pronoun in the middle.'},
    {q:'She ___ an old school friend at the station.', a:'ran into', opts:['ran into','ran her into','into ran'], note:'"Run into" (= meet by chance) is inseparable.'},
    {q:'Our car ___ on the way home.', a:'broke down', opts:['broke down','broke it down','broke down it'], note:'"Break down" is intransitive: it takes no object.'},
    {q:'Here is the book you lent me — I am ___.', a:'giving it back', opts:['giving it back','giving back it'], note:'Separable verb plus a pronoun.'},
    {q:'Here is the form. Please ___ and sign at the bottom.', a:'fill it in', opts:['fill it in','fill in it'], note:'"Fill in the form" and "fill the form in" are both fine, but a pronoun has only one position.'},
    {q:'I am really ___ seeing you again.', a:'looking forward to', opts:['looking forward to','looking to forward','forward looking to'], note:'Never split a three-word phrasal verb.'},
    {q:'The offer was poor, so we ___.', a:'turned it down', opts:['turned it down','turned down it'], note:'Pronoun in the middle.'},
    {q:'He ___ his father — same voice, same walk.', a:'takes after', opts:['takes after','takes him after','after takes'], note:'"Take after" is inseparable.'},
  ],
},
{
  key:'wordform', tab:'Word Forms', title:'Word Form Confusion',
  intro:`<p>Most English words come as a family: one root doing four different jobs. <b>Succeed</b> is the verb, <b>success</b> the noun, <b>successful</b> the adjective, <b>successfully</b> the adverb. Choosing the wrong member is one of the most visible errors in writing, because the sentence is still readable — just clearly non-native.</p><p>The fix is to learn families as sets, and to check what the slot needs: after <i>his</i> or <i>a</i> comes a noun; describing a noun needs an adjective; describing a verb needs an adverb.</p>`,
  groups:[
    {label:'Learn the whole family at once', items:[
      {term:'succeed &middot; success &middot; successful &middot; successfully', key:'v / n / adj / adv', ex:'She <b>succeeded</b>. Her <b>success</b> was total. A <b>successful</b> year. It ended <b>successfully</b>.'},
      {term:'decide &middot; decision &middot; decisive &middot; decisively', key:'v / n / adj / adv', ex:'They <b>decided</b> quickly. It was a bold <b>decision</b>.'},
      {term:'differ &middot; difference &middot; different &middot; differently', key:'v / n / adj / adv', ex:'The two <b>differ</b>. There is a real <b>difference</b>.'},
      {term:'compete &middot; competition / competitor &middot; competitive', key:'v / n / adj', ex:'A <b>competitive</b> market. Our main <b>competitor</b>.'},
      {term:'explain &middot; explanation &middot; explanatory', key:'v / n / adj', ex:'Give me an <b>explanation</b>.'},
      {term:'strengthen &middot; strength &middot; strong &middot; strongly', key:'v / n / adj / adv', ex:'We must <b>strengthen</b> the walls. Their main <b>strength</b>.'},
      {term:'analyse &middot; analysis &middot; analytical &middot; analytically', key:'v / n / adj / adv', ex:'A careful <b>analysis</b> of the data.'},
      {term:'please &middot; pleasure &middot; pleasant &middot; pleasantly', key:'v / n / adj / adv', ex:'A <b>pleasant</b> surprise. It was a <b>pleasure</b>.'},
    ]},
    {label:'Verb vs noun: the classic traps', items:[
      {term:'advise (verb) / advice (noun)', ex:'She <b>advised</b> me to wait. She gave me good <b>advice</b>.', note:'"Advice" is uncountable — never "advices". The verb is pronounced with a /z/.'},
      {term:'practise (verb) / practice (noun)', ex:'You must <b>practise</b> daily. Daily <b>practice</b> helps.', note:'This split is British; American English spells both "practice".'},
      {term:'affect (verb) / effect (noun)', ex:'The rain <b>affected</b> the match. It had a serious <b>effect</b>.', note:'"Effect" can be a verb meaning "bring about", but that is rare and formal.'},
      {term:'lose (verb) / loss (noun) / loose (adjective)', ex:"Don't <b>lose</b> it. A heavy <b>loss</b>. The screw is <b>loose</b>."},
      {term:'rise (no object) / raise (takes an object)', ex:'Prices <b>rose</b>. They <b>raised</b> prices.'},
      {term:'believe (verb) / belief (noun)', ex:'I <b>believe</b> you. A firm <b>belief</b>.'},
      {term:'live (verb) / life (noun) / alive, lively (adjectives)', ex:'They <b>live</b> here. A quiet <b>life</b>.'},
    ]},
    {label:'Adjective vs adverb', items:[
      {term:'good (adjective) / well (adverb)', ex:'A <b>good</b> result. She sings <b>well</b>.'},
      {term:'hard vs hardly', ex:'He works <b>hard</b>.', note:'"Hardly" means almost not: "He hardly works" is the opposite meaning.'},
      {term:'late vs lately', ex:'She arrived <b>late</b>.', note:'"Lately" means recently: "I haven\'t seen her lately."'},
      {term:'near vs nearly', ex:'We live <b>near</b> the station. It is <b>nearly</b> finished.'},
      {term:'high vs highly', ex:'The plane flew <b>high</b>. She is <b>highly</b> respected.', note:'"Highly" is figurative, "high" is literal.'},
      {term:'Some -ly words are adjectives, not adverbs', ex:'A <b>friendly</b> face. A <b>likely</b> outcome.', note:'friendly, lovely, likely, lonely, silly, ugly. You cannot say "he smiled friendly".'},
      {term:'fast, straight, early are both', ex:'A <b>fast</b> car drives <b>fast</b>.', note:'No -ly version exists. "Fastly" is not a word.'},
    ]},
    {label:'-ed vs -ing adjectives', items:[
      {term:'-ing describes the thing', ex:'The film was <b>boring</b>. This is <b>confusing</b>.', note:'The thing causes the feeling.'},
      {term:'-ed describes the person', ex:'I was <b>bored</b>. I am <b>confused</b>.', note:'The person receives the feeling. "I am boring" means you bore other people.'},
      {term:'Common pairs', ex:'interested / interesting, tired / tiring, excited / exciting, surprised / surprising, frustrated / frustrating, worried / worrying.'},
    ]},
    {label:'Endings that change the meaning', items:[
      {term:'-er / -or = the doer, -ee = the receiver', ex:'The <b>employer</b> hires; the <b>employee</b> is hired.', note:'Also interviewer / interviewee, trainer / trainee, payer / payee.'},
      {term:'economic vs economical', ex:'<b>Economic</b> growth. An <b>economical</b> car.', note:'Economic = about the economy. Economical = saves money or resources.'},
      {term:'historic vs historical', ex:'A <b>historic</b> victory. A <b>historical</b> novel.', note:'Historic = important in history. Historical = relating to the past.'},
      {term:'sensible vs sensitive', ex:'A <b>sensible</b> decision. <b>Sensitive</b> skin.', note:'Sensible = showing good judgement. Sensitive = easily affected.'},
      {term:'classic vs classical', ex:'A <b>classic</b> mistake. <b>Classical</b> music.'},
      {term:'efficient vs effective', ex:'An <b>efficient</b> process wastes nothing; an <b>effective</b> one gets the result.'},
    ]},
  ],
  quiz:[
    {q:'His ___ surprised everyone at the office.', a:'success', opts:['success','succeed','successful','successfully'], note:'After "his" the slot needs a noun.'},
    {q:'The team worked very ___ on the project.', a:'hard', opts:['hard','hardly','harder','hardness'], note:'"Hardly" would mean they barely worked at all.'},
    {q:'She gave me some very useful ___.', a:'advice', opts:['advice','advise','advices','advised'], note:'"Advice" is the noun and it is uncountable.'},
    {q:'The film was so ___ that I fell asleep.', a:'boring', opts:['boring','bored','bore','boredom'], note:'-ing describes the thing that causes the feeling.'},
    {q:'I was completely ___ by the ending.', a:'confused', opts:['confused','confusing','confuse','confusion'], note:'-ed describes the person who feels it.'},
    {q:'The new rules had a serious ___ on small firms.', a:'effect', opts:['effect','affect','affection','effective'], note:'"Effect" is the noun; "affect" is the verb.'},
    {q:'He answered every question ___.', a:'correctly', opts:['correctly','correct','correction','corrective'], note:'An adverb is needed to describe how he answered.'},
    {q:'Buying in bulk is far more ___.', a:'economical', opts:['economical','economic','economy','economics'], note:'"Economical" = saves money. "Economic" = about the economy.'},
    {q:'She speaks English very ___.', a:'well', opts:['well','good','goodly','best'], note:'"Good" is the adjective; the adverb is "well".'},
    {q:'The company now employs two hundred ___.', a:'employees', opts:['employees','employers','employments','employed'], note:'-ee = the person who receives the action.'},
    {q:'There is a clear ___ between the two designs.', a:'difference', opts:['difference','different','differ','differently'], note:'After "a clear" the slot needs a noun.'},
    {q:'We must ___ the security of the building.', a:'strengthen', opts:['strengthen','strength','strong','strongly'], note:'After "must" the slot needs a verb.'},
  ],
},
];

/* ============ HELPERS ============ */
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); const t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
/* allow the small set of formatting tags we author inside data */
function fmt(s){ return String(s); }

let topicKey = GRAMMAR[0].key;
function curTopic(){ return GRAMMAR.find(t=>t.key===topicKey); }
function topicIndex(){ return GRAMMAR.findIndex(t=>t.key===topicKey); }

/* ---- topic tabs ---- */
const topicSeg = document.getElementById('topicSeg');
GRAMMAR.forEach(t=>{
  const b=document.createElement('button');
  b.id='topic-'+t.key; b.type='button'; b.setAttribute('role','tab');
  b.setAttribute('aria-selected', t.key===topicKey?'true':'false');
  b.textContent=t.tab;
  b.addEventListener('click', ()=>{ topicKey=t.key; render(); });
  topicSeg.appendChild(b);
});

/* ---- learn ---- */
const learnView=document.getElementById('learnView');
function renderLearn(t){
  let h = '<div class="intro">'+fmt(t.intro)+'</div>';
  t.groups.forEach(g=>{
    h += '<div class="g-group"><div class="g-group-label">'+esc(g.label)+'</div>';
    g.items.forEach(it=>{
      h += '<div class="g-item">'+
        '<div class="gi-term">'+fmt(it.term)+(it.key?' <span class="gi-key">'+esc(it.key)+'</span>':'')+'</div>'+
        (it.ex?'<div class="gi-ex">'+fmt(it.ex)+'</div>':'')+
        (it.note?'<div class="gi-note">'+fmt(it.note)+'</div>':'')+
      '</div>';
    });
    h += '</div>';
  });
  learnView.innerHTML=h;
}

/* ---- practice: full-screen overlay ---- */
const ov=document.getElementById('practiceOverlay');
const pBody=document.getElementById('pBody'), pFoot=document.getElementById('pFoot');
const pCount=document.getElementById('pCount'), pFill=document.getElementById('pFill');
const ctaBtn=document.getElementById('openPractice');
let quiz=null, pAutoTimer=null, pOpen=false;

function openPractice(){
  const t=curTopic();
  quiz={items:shuffle(t.quiz), i:0, correct:0, answered:false, order:[]};
  prepQuestion();
  document.getElementById('pTopic').textContent=t.title;
  ov.hidden=false; pOpen=true;
  document.body.classList.add('p-open');
  renderPractice();
}
function closePractice(){
  clearTimeout(pAutoTimer);
  ov.hidden=true; pOpen=false;
  document.body.classList.remove('p-open');
  ctaBtn.focus();
}
function prepQuestion(){
  quiz.answered=false;
  quiz.order=shuffle(quiz.items[quiz.i].opts);
}
function renderPractice(){
  const n=quiz.items.length;
  if(quiz.i>=n){ renderResult(); return; }
  const q=quiz.items[quiz.i];
  pCount.textContent=(quiz.i+1)+' / '+n;
  pFill.style.width=(quiz.i/n*100)+'%';
  const stack=quiz.order.length%2===1 || quiz.order.some(o=>o.length>16);
  let opts='';
  quiz.order.forEach((o,idx)=>{
    opts+='<button class="p-opt" data-o="'+esc(o)+'"><span class="k">'+(idx+1)+'</span>'+esc(o)+'</button>';
  });
  pBody.innerHTML='<div class="p-wrap">'+
    '<div class="p-q">'+esc(q.q).replace('___','<span class="blank">?</span>')+'</div>'+
    '<div class="p-opts'+(stack?' stack':'')+'" id="pOpts">'+opts+'</div>'+
    '<div class="p-explain" id="pExplain" aria-live="polite"></div>'+
  '</div>';
  pFoot.innerHTML='<span class="p-kbd">1&ndash;'+quiz.order.length+' to answer &middot; Enter to continue</span>'+
    '<button class="p-btn" id="pReveal" type="button">Show answer</button>'+
    '<button class="p-btn primary" id="pNext" type="button" disabled>Next &rarr;</button>';
  document.getElementById('pOpts').addEventListener('click', onAnswer);
  document.getElementById('pReveal').addEventListener('click', revealAnswer);
  document.getElementById('pNext').addEventListener('click', nextQuestion);
  pBody.scrollTop=0;
}
function renderResult(){
  const n=quiz.items.length, pct=Math.round(quiz.correct/n*100);
  pCount.textContent=n+' / '+n;
  pFill.style.width='100%';
  const msg = pct===100 ? 'Every single one. This topic is yours.'
    : pct>=80 ? 'Strong. Skim the notes for the ones you missed.'
    : pct>=50 ? 'Getting there. One more pass will lock it in.'
    : 'Worth reading the notes again before the next round.';
  pBody.innerHTML='<div class="p-wrap">'+
    '<div class="p-done">'+quiz.correct+'<span style="opacity:.35"> / '+n+'</span></div>'+
    '<div class="p-pct">'+pct+'% CORRECT</div>'+
    '<p class="p-explain">'+msg+'</p></div>';
  const nx=GRAMMAR[(topicIndex()+1)%GRAMMAR.length];
  pFoot.innerHTML='<button class="p-btn" id="pBack" type="button">Back to notes</button>'+
    '<button class="p-btn" id="pNextTopic" type="button">'+esc(nx.tab)+' &rarr;</button>'+
    '<button class="p-btn primary grow" id="pRestart" type="button">Practise again</button>';
  document.getElementById('pBack').addEventListener('click', closePractice);
  document.getElementById('pRestart').addEventListener('click', openPractice);
  document.getElementById('pNextTopic').addEventListener('click', ()=>{ topicKey=nx.key; render(); openPractice(); });
}
function markOptions(){
  const q=quiz.items[quiz.i];
  document.querySelectorAll('.p-opt').forEach(b=>{
    b.disabled=true;
    if(b.dataset.o===q.a) b.classList.add('correct');
  });
  document.getElementById('pExplain').innerHTML='<b>'+esc(q.a)+'</b>'+(q.note?' &middot; '+fmt(q.note):'');
  const nb=document.getElementById('pNext');
  nb.disabled=false;
  document.getElementById('pReveal').disabled=true;
  return nb;
}
function onAnswer(e){
  const b=e.target.closest('.p-opt'); if(!b || quiz.answered) return;
  quiz.answered=true;
  const correct=b.dataset.o===quiz.items[quiz.i].a;
  if(correct) quiz.correct++; else b.classList.add('incorrect');
  const nb=markOptions();
  if(correct){ successFX(); clearTimeout(pAutoTimer); pAutoTimer=setTimeout(nextQuestion, 700); }
  else nb.focus();
}
function revealAnswer(){
  if(quiz.answered) return;
  quiz.answered=true;
  markOptions().focus();
}
function nextQuestion(){
  clearTimeout(pAutoTimer);
  quiz.i++;
  if(quiz.i<quiz.items.length) prepQuestion();
  renderPractice();
}

ctaBtn.addEventListener('click', openPractice);
document.getElementById('pExit').addEventListener('click', closePractice);
document.addEventListener('keydown', e=>{
  if(!pOpen || e.metaKey || e.ctrlKey || e.altKey) return;
  if(e.key==='Escape'){ e.preventDefault(); closePractice(); return; }
  if(quiz.i>=quiz.items.length){
    if(e.key==='Enter'){ e.preventDefault(); document.getElementById('pRestart').click(); }
    return;
  }
  if(!quiz.answered && /^[1-9]$/.test(e.key)){
    const b=document.querySelectorAll('.p-opt')[+e.key-1];
    if(b){ e.preventDefault(); b.click(); }
    return;
  }
  if(quiz.answered && (e.key==='Enter'||e.key===' '||e.key==='ArrowRight')){ e.preventDefault(); nextQuestion(); }
});

/* ---- render orchestrator ---- */
function render(){
  const t=curTopic();
  GRAMMAR.forEach(x=>{ const b=document.getElementById('topic-'+x.key); if(b) b.setAttribute('aria-selected', x.key===topicKey?'true':'false'); });
  document.getElementById('topicTitle').textContent=t.title;
  document.getElementById('ctaCount').textContent=t.quiz.length+'Q';
  renderLearn(t);
  window.scrollTo({top:0, behavior:'auto'});
}
render();
</script>
